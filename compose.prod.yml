# Production compose used on the Schowl server by deploy/server-deploy.sh.
# Binds to localhost only: Docker-published ports bypass ufw, and the host's
# nginx proxies malay.schowl.com -> 127.0.0.1:3900 with the Cloudflare origin cert.
name: malay-schowl
services:
  malay-schowl:
    build: .
    image: malay-schowl:latest
    container_name: malay-schowl
    ports:
      - "127.0.0.1:${APP_PORT:-3900}:80"
    restart: unless-stopped
