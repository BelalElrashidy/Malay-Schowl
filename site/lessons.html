<title>Jalan ke Fasih — Malay course</title>
<meta name="description" content="A four-stage Malay course: sounds, sentences, word-building and sounding natural, with audio and quizzes.">

</head><body>
<style>
:root{
  --ground:#F2F4F1; --panel:#FFFFFF; --ink:#15213B; --muted:#5A6477; --line:#DCE1E6;
  --red:#C23A2E; --green:#2E7A58; --gold:#A26C0B; --indigo:#2F4B8A;
  --red-soft:#F8E4E1; --green-soft:#DFF0E7; --gold-soft:#F8EDD5; --indigo-soft:#E2E8F5;
  --shadow:0 1px 2px rgba(21,33,59,.06),0 8px 28px rgba(21,33,59,.08);
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1320; --panel:#161E2E; --ink:#E8ECF3; --muted:#9AA5B8; --line:#263047;
  --red:#EE7A6C; --green:#5FC194; --gold:#E9B650; --indigo:#8FA8E6;
  --red-soft:#3A1F1E; --green-soft:#16332A; --gold-soft:#3A2E15; --indigo-soft:#1D2946;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0D1320; --panel:#161E2E; --ink:#E8ECF3; --muted:#9AA5B8; --line:#263047;
  --red:#EE7A6C; --green:#5FC194; --gold:#E9B650; --indigo:#8FA8E6;
  --red-soft:#3A1F1E; --green-soft:#16332A; --gold-soft:#3A2E15; --indigo-soft:#1D2946;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-family:var(--display);font-size:18px;margin-right:auto;white-space:nowrap}
.brand small{font-family:var(--body);color:var(--muted);font-size:12px;margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
.btn{font:600 13px var(--body);color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn:focus-visible,select:focus-visible,.chip:focus-visible,.reveal:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
select{font:600 13px var(--body);color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:999px;padding:7px 10px;max-width:220px}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--red);width:0;transition:width .25s}
.stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;padding:clamp(18px,4vw,56px) 16px;display:flex;align-items:center;justify-content:center}
.slide[hidden]{display:none!important}
.inner{width:100%;max-width:1080px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel)}
.count{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.nav{display:flex;gap:8px}
.nav .btn{padding:9px 18px;font-size:14px}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:640px){.hint{display:none}}

/* accent per section */
.a0{--a:var(--red);--as:var(--red-soft)} .a1{--a:var(--green);--as:var(--green-soft)}
.a2{--a:var(--gold);--as:var(--gold-soft)} .a3{--a:var(--indigo);--as:var(--indigo-soft)}

/* songket motif */
.motif{background-color:var(--as);background-image:
  linear-gradient(45deg,transparent 46%,color-mix(in srgb,var(--a) 17%,transparent) 46% 54%,transparent 54%),
  linear-gradient(-45deg,transparent 46%,color-mix(in srgb,var(--a) 17%,transparent) 46% 54%,transparent 54%);
  background-size:26px 26px}

/* title / section slides */
.eyebrow{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--a,var(--red))}
.sec{border-radius:22px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr)}
.sec-top{padding:clamp(22px,4vw,44px);position:relative}
.sec-top .band{position:absolute;inset:0 0 auto 0;height:10px}
.sec h2{font-family:var(--display);font-weight:400;font-size:clamp(36px,6.5vw,72px);line-height:1.02;margin:10px 0 4px;text-wrap:balance}
.sec .sub{font-size:clamp(16px,2vw,22px);color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 clamp(22px,4vw,44px) clamp(22px,4vw,44px)}
.chip{font:600 14px var(--body);border:1px solid var(--line);background:var(--ground);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--a)}
.chip span{color:var(--muted);font-weight:500}
.tool .chip span{display:none}

/* word card */
.word{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);background:var(--panel);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);min-height:min(560px,70vh)}
.pic{display:flex;align-items:center;justify-content:center;position:relative;padding:28px}
.pic .em{font-size:clamp(90px,15vw,190px);line-height:1;filter:drop-shadow(0 10px 18px rgba(0,0,0,.14));animation:pop .35s ease}
.pic .tag{position:absolute;left:16px;top:16px;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;background:var(--panel);color:var(--a);border-radius:999px;padding:5px 10px}
.txt{padding:clamp(22px,4vw,48px);display:flex;flex-direction:column;justify-content:center;gap:16px;min-width:0}
.ms{font-family:var(--display);font-size:clamp(40px,7vw,86px);line-height:1.02;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.speak{border:none;background:var(--a);color:var(--panel);border-radius:999px;padding:8px 14px;font:600 13px var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.speak svg{width:15px;height:15px}
.speak.slow{background:transparent;color:var(--a);border:1px solid var(--a)}
.reveal{all:unset;cursor:pointer;display:block;border-radius:12px}
.en{font-size:clamp(22px,3vw,34px);font-weight:600;margin:0}
.test .reveal .hid{filter:blur(9px);opacity:.55;user-select:none}
.reveal .hid{transition:filter .2s,opacity .2s}
.reveal .cue{display:none;font-size:12px;color:var(--muted);margin-top:4px}
.test .reveal:not(.shown) .cue{display:block}
.test .reveal.shown .hid{filter:none;opacity:1}
.ex{border-left:4px solid var(--a);background:var(--as);border-radius:0 12px 12px 0;padding:14px 16px}
.ex .xm{font-size:clamp(17px,2vw,22px);font-weight:600;margin:0 0 4px}
.ex .xe{margin:0;color:var(--muted);font-size:15px}
.note{font-size:15px;color:var(--muted);margin:0;display:flex;gap:8px}
.note b{color:var(--a);font-weight:700}
@keyframes pop{from{transform:scale(.8);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pic .em{animation:none}.progress i{transition:none}}

/* phrase card */
.phrase{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.phrase .head{display:flex;align-items:center;gap:12px;padding:14px clamp(20px,4vw,44px)}
.phrase .head .ic{font-size:26px}
.phrase .head b{font-weight:700}
.phrase .head span{color:var(--muted);font-size:14px}
.phrase .body{padding:clamp(24px,5vw,60px) clamp(20px,4vw,56px);display:flex;flex-direction:column;gap:18px}
.phrase .ms{font-size:clamp(34px,5.6vw,68px)}
.phrase .dots{display:flex;gap:5px;padding:0 clamp(20px,4vw,56px) 22px;flex-wrap:wrap}
.phrase .dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.phrase .dots i.on{background:var(--a)}

/* intro */
.intro{display:grid;gap:22px}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,8vw,96px);line-height:1;margin:6px 0 0;text-wrap:balance}
.intro .lede{font-size:clamp(17px,2vw,21px);color:var(--muted);max-width:62ch;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0 0 6px;font-size:15px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.sounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.snd{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.snd b{font-family:var(--display);font-weight:400;font-size:26px;display:block}
.snd span{font-size:13px;color:var(--muted)}
kbd{font:500 12px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--panel)}
@media (max-width:760px){
  .word{grid-template-columns:minmax(0,1fr);min-height:0}
  .pic{padding:52px 20px 28px}
  .slide{align-items:flex-start}
  .brand small{display:none}
}

body{overflow:auto}
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
aside{border-right:1px solid var(--line);background:var(--panel);padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-family:var(--display);font-size:26px;line-height:1.1;margin:0}
.logo-sub{color:var(--muted);font-size:13px;margin:4px 0 16px}
.meter{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.meter .track{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter .track i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));width:0;transition:width .3s}
.meter b{font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.stage-h{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--a);margin:18px 6px 6px;display:flex;justify-content:space-between}
.stage-h span{color:var(--muted)}
.lnk{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:8px 8px;border-radius:10px;font-size:14px}
.lnk:hover{background:var(--ground)}
.lnk:focus-visible{outline:2px solid var(--indigo)}
.lnk[aria-current="true"]{background:var(--as)}
.lnk .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:500 12px var(--mono);border:1.5px solid var(--line);color:var(--muted)}
.lnk.done .n{background:var(--a);border-color:var(--a);color:var(--panel)}
.lnk small{display:block;color:var(--muted);font-size:12px}
main{padding-block:28px 60px;padding-inline:clamp(16px,5vw,64px);min-width:0}
.wrap{max-width:820px;margin:0 auto}
.hero{border-radius:22px;padding:clamp(22px,4vw,40px);margin-bottom:28px;position:relative;overflow:hidden}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,6vw,64px);line-height:1.02;margin:8px 0 6px;text-wrap:balance}
.hero .en-t{font-size:clamp(18px,2.2vw,24px);font-weight:600;margin:0}
.goal{display:inline-flex;gap:8px;align-items:center;background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px;margin-top:14px;box-shadow:var(--shadow)}
.goal b{color:var(--a)}
.blk{margin:0 0 22px}
.blk p{font-size:17px;line-height:1.65;margin:0;max-width:68ch}
h3.sub-h{font-family:var(--display);font-weight:400;font-size:26px;margin:34px 0 12px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--ground)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
tr:last-child td{border-bottom:none}
td:first-child{font-weight:700;white-space:nowrap}
td b{color:var(--a)}
.exs{display:grid;gap:8px}
.exl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--as);border-radius:12px;padding:10px 14px}
.exl .m{font-weight:700;font-size:17px}
.exl .e{color:var(--muted);font-size:14px}
.spk{border:none;background:var(--a);color:var(--panel);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.spk svg{width:16px;height:16px}
.spk:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.tipbox{border-radius:14px;padding:14px 16px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);font-size:15px;line-height:1.6}
.tipbox::before{content:"Tip";display:block;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.quiz{margin-top:40px;background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:clamp(20px,4vw,32px)}
.quiz h2{font-family:var(--display);font-weight:400;font-size:30px;margin:4px 0 18px}
.q{padding:16px 0;border-top:1px solid var(--line)}
.q p{margin:0 0 10px;font-weight:600;font-size:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{font:500 15px var(--body);text-align:left;color:var(--ink);background:var(--ground);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--a)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.fb{font-size:14px;margin-top:8px;color:var(--muted)}
.fb b.ok{color:var(--green)} .fb b.no{color:var(--red)}
.score{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.score b{font:500 15px var(--mono)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.primary{background:var(--ink)!important;color:var(--ground)!important;border-color:var(--ink)!important}
.mobile-nav{display:none}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:8px}
.ov{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.ov:hover{border-color:var(--a)}
.ov b{font-family:var(--display);font-weight:400;font-size:20px}
.ov span{color:var(--muted);font-size:14px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside{display:none}
  .mobile-nav{display:flex;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
  .mobile-nav select{flex:1;max-width:none;min-width:0}
  main{padding-block:18px 40px}
}
.home{font:600 13px var(--body);color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:4px 2px}
.theme-btn svg{flex:none}
.mobile-nav .theme-btn{padding:8px 10px}.mobile-nav .theme-label{display:none}
.home:hover{color:var(--ink)}
.home:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
</style>

  <aside>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><a class="home" href="./">← All decks</a><button class="btn theme-btn" type="button" aria-label="Switch theme"></button></div>
    <p class="logo">Jalan ke Fasih</p>

  </aside>
  <main id="view"></main>
</div>
<script>
const D = {"stages": [["Foundations", "Sounds, greetings and your first sentences"], ["Building sentences", "Questions, time, numbers and word order"], ["Word-building", "Prefixes and suffixes — the engine of Malay"], ["Sounding natural", "Politeness, everyday speech and fluency"]], "lessons": [{"stage": 0, "title": "Sounds & spelling", "ms": "Bunyi dan ejaan", "goal": "Read any Malay word aloud with confidence.", "blocks": [["p", "Good news first: Malay uses the Latin alphabet and is spelled almost exactly as it sounds. There are no tones, no genders, no verb conjugations. Stress is light and usually falls on the second-last syllable."], ["t", ["Letter(s)", "Sounds like", "Example"], [["a", "a in <i>father</i>", "<b>makan</b> (eat)"], ["e", "usually a short 'uh' (schwa); sometimes 'eh'", "<b>emak</b> (mum) · <b>elok</b> (nice)"], ["i", "ee in <i>see</i>", "<b>ikan</b> (fish)"], ["o", "o in <i>for</i>", "<b>orang</b> (person)"], ["u", "oo in <i>food</i>", "<b>udang</b> (prawn)"], ["c", "ch in <i>chair</i> — never k or s", "<b>cari</b> (search)"], ["g", "always hard, as in <i>go</i>", "<b>gigi</b> (teeth)"], ["ng", "ng in <i>singer</i> (no hard g)", "<b>bunga</b> (flower)"], ["ngg", "ng in <i>finger</i>", "<b>tangga</b> (stairs)"], ["ny", "ny in <i>canyon</i>", "<b>nyanyi</b> (sing)"], ["sy", "sh in <i>ship</i>", "<b>syarikat</b> (company)"], ["kh", "like Arabic خ", "<b>khabar</b> (news)"], ["final k", "a glottal stop — cut the sound", "<b>budak</b> (kid) ≈ budaʔ"], ["ai / au", "'eye' / 'ow'", "<b>pantai</b> (beach) · <b>pulau</b> (island)"]]], ["tip", "<b>Arabic speaker advantage:</b> <i>kh</i>, <i>sy</i> and the glottal stop will feel natural to you. Hundreds of Malay words come from Arabic — see Lesson 6."], ["ex", [["saya", "I"], ["terima kasih", "thank you"], ["selamat", "safe / greetings"], ["bunga", "flower"], ["cawan", "cup"]]]], "quiz": [["How is 'c' pronounced in <b>cari</b>?", ["k", "s", "ch", "ts"], 2, "Malay c is always 'ch'."], ["Which word has a glottal stop at the end?", ["makan", "budak", "saya", "bunga"], 1, "A final -k is cut short: budaʔ."], ["'ng' in <b>bunga</b> sounds like…", ["finger", "singer", "angle", "gun"], 1, "No hard g — like 'singer'."], ["Does Malay change verbs for past/present tense?", ["Yes, always", "Only for 'to be'", "No — time words do the job", "Only in writing"], 2, "Verbs never conjugate; words like sudah and akan mark time."]]}, {"stage": 0, "title": "Greetings & introductions", "ms": "Salam perkenalan", "goal": "Greet people at any time of day and introduce yourself.", "blocks": [["p", "<b>Selamat</b> means 'safe / blessed' and starts most greetings. The time of day decides the second word."], ["t", ["Greeting", "When", "Meaning"], [["Selamat pagi", "until ~11 a.m.", "Good morning"], ["Selamat tengah hari", "~11 a.m.–2 p.m.", "Good day"], ["Selamat petang", "~2 p.m.–7 p.m.", "Good afternoon/evening"], ["Selamat malam", "night (also 'good night')", "Good evening / night"], ["Assalamualaikum", "any time, very common", "Peace be upon you"]]], ["h", "A first conversation"], ["ex", [["A: Assalamualaikum. Apa khabar?", "A: Peace be upon you. How are you?"], ["B: Waalaikumussalam. Khabar baik. Awak?", "B: And upon you. I'm fine. You?"], ["A: Baik juga. Nama saya Bilal. Siapa nama awak?", "A: Good too. My name is Bilal. What's your name?"], ["B: Nama saya Aisyah. Awak dari mana?", "B: My name is Aisyah. Where are you from?"], ["A: Saya dari Mesir. Selamat berkenalan!", "A: I'm from Egypt. Nice to meet you!"]]], ["tip", "Goodbyes depend on who leaves: say <b>selamat jalan</b> to the person <i>leaving</i> ('safe journey') and <b>selamat tinggal</b> to the person <i>staying</i> ('safe staying'). <b>Jumpa lagi</b> (see you) works for everyone."]], "quiz": [["It's 4 p.m. Which greeting fits?", ["Selamat pagi", "Selamat petang", "Selamat malam", "Selamat jalan"], 1, "Petang covers the afternoon and early evening."], ["You're leaving a friend's house. What does your friend say to you?", ["Selamat tinggal", "Selamat datang", "Selamat jalan", "Selamat pagi"], 2, "The one staying wishes the leaver a safe journey."], ["'Siapa nama awak?' literally uses which question word?", ["what", "who", "where", "how"], 1, "Malay asks 'who is your name?'"], ["Best reply to 'Apa khabar?'", ["Sama-sama", "Khabar baik", "Tak apa", "Jumpa lagi"], 1, "Khabar baik = (the news is) good."]]}, {"stage": 0, "title": "Pronouns, this & that", "ms": "Kata ganti nama", "goal": "Talk about yourself and others at the right level of politeness.", "blocks": [["t", ["Malay", "English", "Use it when…"], [["saya", "I / me", "the safe default, everywhere"], ["aku", "I / me", "close friends and family only"], ["awak", "you", "peers, friends (Peninsular)"], ["anda", "you", "ads, signs, formal writing"], ["kamu", "you", "to younger people; avoid with elders"], ["dia", "he / she", "no gender in Malay"], ["kami", "we (not you)", "'my group, not yours'"], ["kita", "we (including you)", "'all of us together'"], ["mereka", "they", "people"]]], ["tip", "<b>kami vs kita</b> matters: telling a waiter <i>'Kami nak dua meja'</i> (we — my group — want two tables) is right; <i>'Jom kita makan'</i> (let's — you and me — eat) invites the listener."], ["p", "Malaysians often avoid 'you' with elders and use a title instead: <i>'Pak cik nak minum apa?'</i> — 'What would uncle like to drink?' (Lesson 20)."], ["h", "This and that"], ["p", "<b>ini</b> = this, <b>itu</b> = that. They go <i>after</i> the noun: <b>buku ini</b> = this book. Casual speech shortens them to <b>ni</b> and <b>tu</b>."], ["ex", [["Ini kawan saya.", "This is my friend."], ["Rumah itu besar.", "That house is big."], ["Dia guru kami.", "She is our teacher."], ["Kita pergi sekarang?", "Shall we go now?"]]]], "quiz": [["You're inviting your friend: 'Let's eat!' Which 'we'?", ["kami", "kita", "mereka", "saya"], 1, "Kita includes the listener."], ["'This car' is…", ["ini kereta", "kereta ini", "kereta itu", "itu kereta"], 1, "Demonstratives follow the noun."], ["'Dia' means…", ["he only", "she only", "he or she", "they"], 2, "Malay pronouns have no gender."], ["Which 'I' is safest with strangers?", ["aku", "saya", "gua", "kita"], 1, "Saya is polite and neutral."]]}, {"stage": 0, "title": "Basic sentences & negation", "ms": "Ayat asas", "goal": "Build 'X is Y' sentences and say no correctly.", "blocks": [["p", "Malay has <b>no verb 'to be'</b>. Just place the words side by side. Word order is the same as English: Subject – Verb – Object."], ["ex", [["Saya pelajar.", "I (am a) student."], ["Dia penat.", "She (is) tired."], ["Kami di rumah.", "We (are) at home."], ["Ali makan nasi.", "Ali eats rice."]]], ["p", "In formal writing you'll see <b>ialah</b> / <b>adalah</b> as a linking 'is': <i>Kuala Lumpur ialah ibu negara Malaysia.</i> In conversation you can drop it."], ["h", "Ways to say no"], ["t", ["Word", "Negates", "Example"], [["tidak (tak)", "verbs & adjectives", "Saya <b>tidak</b> faham. · Ini <b>tak</b> mahal."], ["bukan", "nouns & pronouns", "Dia <b>bukan</b> doktor. · Itu <b>bukan</b> saya."], ["belum", "not yet", "Saya <b>belum</b> makan."], ["jangan", "don't (commands)", "<b>Jangan</b> risau."], ["tiada / tak ada", "there isn't / don't have", "Saya <b>tak ada</b> duit tunai."]]], ["tip", "<b>ada</b> is a power word: 'have' and 'there is'. <i>Saya ada kereta</i> (I have a car). <i>Ada tandas di sini?</i> (Is there a toilet here?)"]], "quiz": [["'He is not a teacher.'", ["Dia tidak guru.", "Dia bukan guru.", "Dia jangan guru.", "Dia belum guru."], 1, "Nouns take bukan."], ["'This food is not spicy.'", ["Makanan ini bukan pedas.", "Makanan ini tidak pedas.", "Makanan ini jangan pedas.", "Makanan ini tiada pedas."], 1, "Adjectives take tidak."], ["'I haven't eaten yet.'", ["Saya tidak makan.", "Saya bukan makan.", "Saya belum makan.", "Saya jangan makan."], 2, "belum = not yet."], ["How do you say 'I am hungry'?", ["Saya adalah lapar.", "Saya lapar.", "Saya ada lapar.", "Lapar saya."], 1, "No 'to be' needed."]]}, {"stage": 0, "title": "Numbers & money", "ms": "Nombor dan wang", "goal": "Count, give prices and understand ringgit.", "blocks": [["t", ["", "", "", ""], [["1 satu", "2 dua", "3 tiga", "4 empat"], ["5 lima", "6 enam", "7 tujuh", "8 lapan"], ["9 sembilan", "10 sepuluh", "0 kosong / sifar", "½ setengah"]]], ["p", "Everything else is built with four building blocks. <b>se-</b> replaces <i>satu</i> for 'one' of a block."], ["t", ["Block", "Meaning", "Examples"], [["belas", "teens (11–19)", "sebelas 11 · dua belas 12 · sembilan belas 19"], ["puluh", "tens", "sepuluh 10 · dua puluh 20 · tiga puluh lima 35"], ["ratus", "hundreds", "seratus 100 · empat ratus 400"], ["ribu", "thousands", "seribu 1,000 · dua ribu lima ratus 2,500"], ["juta", "millions", "sejuta 1,000,000"]]], ["ex", [["RM 12.50 — dua belas ringgit lima puluh sen", "twelve ringgit fifty cents"], ["RM 1,250 — seribu dua ratus lima puluh ringgit", "1,250 ringgit"], ["Berapa harga ini? — Lapan ringgit.", "How much is this? — Eight ringgit."]]], ["tip", "Ordinals use <b>ke-</b>: <i>kedua</i> (2nd), <i>ketiga</i> (3rd). The one exception: 1st is <b>pertama</b>. RM 2.50 is often said <i>dua ringgit setengah</i> (two and a half ringgit)."]], "quiz": [["What is 'tujuh belas'?", ["7", "70", "17", "27"], 2, "belas = teen."], ["How do you say 300?", ["tiga puluh", "tiga ratus", "setiga ratus", "tiga ribu"], 1, "ratus = hundred."], ["'The third day' is…", ["hari tiga", "hari ketiga", "hari pertiga", "tiga hari"], 1, "ke- makes ordinals (tiga hari = three days)."], ["'Seribu lima ratus' is…", ["150", "1,005", "1,500", "15,000"], 2, "1,000 + 500."]]}, {"stage": 0, "title": "Words you already know", "ms": "Kata pinjaman Arab", "goal": "Unlock hundreds of words through Arabic and English loans.", "blocks": [["p", "Centuries of trade and Islamic scholarship brought many Arabic words into Malay. As an Arabic speaker, you start with a real head start."], ["t", ["Malay", "Arabic root", "Meaning"], [["kitab", "كتاب", "(religious) book"], ["kamus", "قاموس", "dictionary"], ["waktu", "وقت", "time"], ["fikir", "فكر", "think"], ["khabar", "خبر", "news (apa khabar?)"], ["sabar", "صبر", "patient"], ["hadiah", "هدية", "gift"], ["kerusi", "كرسي", "chair"], ["kertas", "قرطاس", "paper"], ["sahabat", "صاحب", "close friend"], ["awal / akhir", "أول / آخر", "early / end"], ["zaman", "زمان", "era"], ["rehat", "راحة", "rest, break"], ["nasihat", "نصيحة", "advice"], ["soal / jawab", "سؤال / جواب", "question / answer"], ["ahli", "أهل", "member"], ["wakil", "وكيل", "representative"], ["maaf", "معاف", "sorry"]]], ["tip", "Watch for meaning shifts: <b>kitab</b> usually means a religious text (a normal book is <b>buku</b>), and <b>sahabat</b> is a close friend, not a Companion."], ["h", "English loans with Malay spelling"], ["p", "Many modern words come from English, respelled phonetically: <b>teksi, bas, stesen, klinik, polis, universiti, komputer, teknologi, doktor, polisi</b>. Spelling tip: English <i>-tion</i> → <b>-si</b> (<i>informasi</i>), <i>-ty</i> → <b>-ti</b> (<i>universiti</i>)."]], "quiz": [["<b>kamus</b> means…", ["camera", "dictionary", "curtain", "cushion"], 1, "From قاموس."], ["<b>jawab</b> means…", ["question", "answer", "gift", "time"], 1, "From جواب."], ["Guess the Malay spelling of 'station'", ["steshen", "stesen", "stasion", "setesen"], 1, "Malaysian spelling: stesen."], ["An everyday book (not religious) is…", ["kitab", "buku", "kertas", "kamus"], 1, "buku is the everyday word."]]}, {"stage": 1, "title": "Asking questions", "ms": "Kata tanya", "goal": "Ask anything — and understand the answer.", "blocks": [["t", ["Word", "Meaning", "Example"], [["apa", "what", "<b>Apa</b> ini? — What is this?"], ["siapa", "who", "<b>Siapa</b> dia? — Who is he?"], ["di mana", "where (location)", "Hotel <b>di mana</b>? — Where's the hotel?"], ["ke mana", "where to", "Awak pergi <b>ke mana</b>?"], ["dari mana", "where from", "Awak <b>dari mana</b>?"], ["bila", "when", "<b>Bila</b> bas sampai?"], ["kenapa / mengapa", "why", "<b>Kenapa</b> tutup?"], ["bagaimana / macam mana", "how", "<b>Macam mana</b> nak pergi?"], ["berapa", "how many / much", "<b>Berapa</b> harga? · <b>Berapa</b> orang?"], ["yang mana", "which", "<b>Yang mana</b> satu?"]]], ["h", "Yes/no questions — three registers"], ["t", ["Style", "Pattern", "Example"], [["Spoken (easiest)", "rising intonation", "Awak pelajar?"], ["Formal", "Adakah … ? or word + -kah", "<b>Adakah</b> awak pelajar? · Pelajar<b>kah</b> awak?"], ["Casual", "add ke / tak at the end", "Awak pelajar <b>ke</b>? · Nak <b>tak</b>?"]]], ["tip", "Answer yes/no questions by repeating the key word: <i>'Awak faham?' — 'Faham.'</i> / <i>'Tak faham.'</i> It sounds more natural than just <i>ya</i>."]], "quiz": [["'Where are you going?'", ["Awak di mana?", "Awak pergi ke mana?", "Awak dari mana?", "Awak bila?"], 1, "ke mana = where to."], ["'How many people?'", ["Apa orang?", "Berapa orang?", "Siapa orang?", "Bila orang?"], 1, "berapa = how many."], ["Which is the formal yes/no question?", ["Awak nak ke?", "Adakah awak lapar?", "Lapar tak?", "Awak lapar?"], 1, "Adakah is formal."], ["Natural reply to 'Awak faham?'", ["Ya ya ya", "Faham.", "Adakah.", "Bukan."], 1, "Repeat the key word."]]}, {"stage": 1, "title": "Time & tense", "ms": "Penanda masa", "goal": "Talk about past, present and future without changing a verb.", "blocks": [["p", "Malay verbs never change. Instead, you add a <b>time marker</b> before the verb — or a time word anywhere in the sentence."], ["t", ["Marker", "Casual", "Meaning", "Example"], [["sudah / telah", "dah", "already (done)", "Saya <b>sudah</b> makan."], ["sedang", "tengah", "in the middle of", "Dia <b>sedang</b> tidur."], ["akan", "nak", "will", "Kami <b>akan</b> datang."], ["belum", "—", "not yet", "Bas <b>belum</b> sampai."], ["pernah", "—", "have ever", "Awak <b>pernah</b> ke Penang?"], ["baru", "—", "just (now)", "Saya <b>baru</b> sampai."], ["masih", "—", "still", "Dia <b>masih</b> belajar."]]], ["t", ["Frequency", "Meaning"], [["selalu", "always / often"], ["biasanya", "usually"], ["kadang-kadang", "sometimes"], ["jarang", "rarely"], ["tidak pernah", "never"]]], ["ex", [["Semalam saya pergi ke pasar.", "Yesterday I went to the market."], ["Esok saya pergi ke pasar.", "Tomorrow I'll go to the market."], ["Awak dah makan? — Belum.", "Have you eaten? — Not yet."]]]], "quiz": [["'She is (currently) cooking.'", ["Dia sudah memasak.", "Dia sedang memasak.", "Dia akan memasak.", "Dia pernah memasak."], 1, "sedang = in progress."], ["'Have you ever been to Langkawi?'", ["Awak akan ke Langkawi?", "Awak pernah ke Langkawi?", "Awak sedang ke Langkawi?", "Awak masih ke Langkawi?"], 1, "pernah = ever."], ["Casual form of 'sudah'?", ["nak", "dah", "tengah", "tak"], 1, "dah."], ["Negative answer to 'Dah siap?' (ready yet?)", ["Bukan", "Belum", "Jangan", "Tiada"], 1, "belum = not yet."]]}, {"stage": 1, "title": "Word order & possession", "ms": "Susunan kata", "goal": "Put describing words and owners in the right place.", "blocks": [["p", "The golden rule: <b>the main word comes first</b>, and everything describing it follows. English reads right-to-left compared to Malay."], ["t", ["English", "Malay", "Word by word"], [["big house", "rumah besar", "house big"], ["my house", "rumah saya", "house my"], ["my big house", "rumah besar saya", "house big my"], ["that big house", "rumah besar itu", "house big that"], ["Ali's car", "kereta Ali", "car Ali"], ["fried rice", "nasi goreng", "rice fried"]]], ["h", "The magic suffix -nya"], ["p", "<b>-nya</b> has three everyday jobs:"], ["t", ["Job", "Example", "Meaning"], [["his / her / its", "rumah<b>nya</b>", "his/her house"], ["'the' (something known)", "Harga<b>nya</b> berapa?", "What's the price (of it)?"], ["exclamation", "Cantik<b>nya</b>!", "How beautiful!"]]], ["p", "Casual suffixes: <b>-ku</b> (my) and <b>-mu</b> (your): <i>kawanku</i> = my friend. Common in songs and among close friends."], ["tip", "Use <b>yang</b> ('which/that is') to add longer descriptions or pick one out: <i>kereta <b>yang</b> merah</i> = the car that's red; <i>yang ini</i> = this one."]], "quiz": [["'My new phone'", ["saya telefon baru", "telefon saya baru", "telefon baru saya", "baru telefon saya"], 2, "noun + adjective + owner."], ["'Mahalnya!' means…", ["Its price", "How expensive!", "Not expensive", "Expensive one"], 1, "-nya as an exclamation."], ["'The one that's cheap'", ["yang murah", "murah yang", "itu murah", "murahnya"], 0, "yang + adjective."], ["'Her bag'", ["begnya", "nyabeg", "dia-beg", "beg-dia-nya"], 0, "-nya = his/her."]]}, {"stage": 1, "title": "Plurals & quantities", "ms": "Jamak", "goal": "Make plurals and talk about amounts.", "blocks": [["p", "Malay nouns don't need a plural ending — context usually makes it clear. When you want to stress plurality, <b>double the word</b>."], ["ex", [["buku → buku-buku", "books (various)"], ["orang → orang-orang", "people"], ["kanak-kanak", "children (always doubled)"]]], ["tip", "Never double after a number or quantity word: <b>dua buku</b>, <b>banyak buku</b> — not <s>dua buku-buku</s>."], ["t", ["Quantity word", "Meaning"], [["banyak", "many / a lot"], ["ramai", "many (people only)"], ["sedikit / sikit", "a little / few"], ["semua", "all"], ["setiap", "every"], ["beberapa", "several"], ["para", "plural marker for groups (para pelajar)"]]], ["h", "Doubling changes meaning too"], ["t", ["Doubled", "Meaning"], [["jalan-jalan", "stroll / sightseeing"], ["cepat-cepat", "quickly!"], ["baik-baik", "carefully / take care"], ["kuning-kuning", "yellowish"], ["tengok-tengok", "just looking around"]]]], "quiz": [["'Three cats'", ["tiga kucing-kucing", "tiga kucing", "kucing tiga-tiga", "kucing-kucing tiga"], 1, "No doubling after numbers."], ["'Many people' (natural)", ["ramai orang", "banyak orang-orang", "orang ramai-ramai", "semua-semua orang"], 0, "ramai is used for people (banyak orang is also heard)."], ["'Jalan-jalan' means…", ["roads", "to stroll around", "to run", "streets only"], 1, "Doubling gives a relaxed sense."], ["'Every day'", ["semua hari", "setiap hari", "hari-hari semua", "banyak hari"], 1, "setiap = every."]]}, {"stage": 1, "title": "Counting words", "ms": "Penjodoh bilangan", "goal": "Use classifiers like a native speaker.", "blocks": [["p", "Like Chinese or Japanese, Malay uses a <b>classifier</b> between the number and the noun. With 'one', the number becomes <b>se-</b>: <i>seorang, sebuah</i>."], ["t", ["Classifier", "For", "Example"], [["orang", "people", "<b>dua orang</b> pelajar — two students"], ["ekor", "animals ('tail')", "<b>tiga ekor</b> kucing — three cats"], ["buah", "large or general objects", "<b>sebuah</b> kereta · <b>dua buah</b> rumah"], ["biji", "small, round things", "<b>sebiji</b> telur · <b>dua biji</b> epal"], ["helai", "clothes, sheets, hair", "<b>sehelai</b> baju"], ["keping", "flat pieces", "<b>sekeping</b> roti · <b>dua keping</b> gambar"], ["batang", "long, stick-like", "<b>sebatang</b> pen · <b>sebatang</b> pokok"], ["cawan / pinggan", "a cup / plate of", "<b>dua cawan</b> kopi · <b>sepinggan</b> nasi"]]], ["tip", "Stuck? <b>buah</b> works for most objects, and in casual speech people often drop the classifier completely: <i>teh tarik dua</i>."]], "quiz": [["'Two cats'", ["dua orang kucing", "dua ekor kucing", "dua buah kucing", "dua biji kucing"], 1, "Animals use ekor."], ["'One house'", ["satu orang rumah", "sebuah rumah", "sebiji rumah", "seekor rumah"], 1, "buah for large objects; se- for one."], ["'Three eggs'", ["tiga biji telur", "tiga helai telur", "tiga ekor telur", "tiga batang telur"], 0, "Small round things: biji."], ["'A shirt'", ["sebatang baju", "sekeping baju", "sehelai baju", "seorang baju"], 2, "Clothes: helai."]]}, {"stage": 1, "title": "Prepositions & places", "ms": "Kata sendi", "goal": "Say where things are and where you're going.", "blocks": [["t", ["Word", "Meaning", "Example"], [["di", "at / in / on (location)", "Saya <b>di</b> pejabat."], ["ke", "to (a place)", "Saya pergi <b>ke</b> bank."], ["dari / daripada", "from (place) / from (person, comparison)", "<b>dari</b> Kaherah · hadiah <b>daripada</b> ibu"], ["kepada", "to (a person)", "Beri <b>kepada</b> dia."], ["pada", "on/at (time)", "<b>pada</b> hari Isnin · <b>pada</b> pukul tiga"], ["dengan", "with / by", "<b>dengan</b> kawan · <b>dengan</b> bas"], ["untuk", "for", "<b>untuk</b> awak"], ["tentang", "about", "<b>tentang</b> Malaysia"]]], ["p", "Combine <b>di / ke / dari</b> with position words:"], ["t", ["Position", "Meaning"], [["atas", "on / above"], ["bawah", "under / below"], ["dalam", "inside"], ["luar", "outside"], ["depan", "in front"], ["belakang", "behind"], ["sebelah", "next to"], ["antara", "between"], ["seberang", "across"]]], ["ex", [["Kunci di atas meja.", "The key is on the table."], ["Kucing lari ke bawah katil.", "The cat ran under the bed."], ["Stesen di seberang jalan.", "The station is across the road."]]], ["tip", "In speech, <b>di</b> is often replaced by <b>kat</b> (from <i>dekat</i>): <i>Awak kat mana?</i> — Where are you?"]], "quiz": [["'I'm going to Penang.'", ["Saya pergi di Penang.", "Saya pergi ke Penang.", "Saya pergi dari Penang.", "Saya pergi pada Penang."], 1, "ke = movement to."], ["'Give it to Ahmad.'", ["Beri ke Ahmad.", "Beri kepada Ahmad.", "Beri di Ahmad.", "Beri dari Ahmad."], 1, "kepada for people."], ["'Under the table'", ["di atas meja", "di bawah meja", "di dalam meja", "di luar meja"], 1, "bawah = under."], ["'On Friday'", ["di hari Jumaat", "ke hari Jumaat", "pada hari Jumaat", "dengan hari Jumaat"], 2, "pada for time."]]}, {"stage": 1, "title": "Clock, days & dates", "ms": "Waktu dan tarikh", "goal": "Tell the time, make appointments and read dates.", "blocks": [["p", "<b>Pukul</b> + number = o'clock. Add the time of day for clarity instead of a.m./p.m."], ["t", ["Time", "Malay"], [["7:00 a.m.", "pukul tujuh pagi"], ["1:00 p.m.", "pukul satu tengah hari"], ["4:30 p.m.", "pukul empat setengah petang"], ["8:15", "pukul lapan suku (quarter)"], ["8:45", "pukul sembilan kurang suku (nine less a quarter)"], ["9:20 p.m.", "pukul sembilan dua puluh minit malam"]]], ["t", ["Months", "", "", ""], [["Januari", "Februari", "Mac", "April"], ["Mei", "Jun", "Julai", "Ogos"], ["September", "Oktober", "November", "Disember"]]], ["p", "Dates run day–month–year: <b>16 September 2026</b> = <i>enam belas September dua ribu dua puluh enam</i>. Ask the date with <i>Hari ini berapa hari bulan?</i>"], ["ex", [["Pukul berapa sekarang?", "What time is it now?"], ["Kita jumpa pukul tiga petang, boleh?", "Let's meet at 3 p.m., okay?"], ["Hari ini hari apa? — Hari Rabu.", "What day is it? — Wednesday."]]], ["tip", "<b>Pukul berapa</b> asks the time on a clock. <b>Berapa jam</b> asks 'how many hours'."]], "quiz": [["'Half past six in the evening'", ["pukul enam setengah petang", "pukul setengah enam malam", "pukul enam suku petang", "enam jam petang"], 0, "Hour + setengah + time of day."], ["'Pukul lapan kurang suku' is…", ["8:15", "7:45", "8:45", "8:30"], 1, "Eight less a quarter."], ["August in Malay is…", ["Agustus", "Ogos", "Augos", "Agos"], 1, "Malaysian spelling: Ogos."], ["'How many hours?'", ["Pukul berapa?", "Berapa jam?", "Bila jam?", "Jam apa?"], 1, "berapa jam = how many hours."]]}, {"stage": 2, "title": "Roots & the ber- prefix", "ms": "Awalan ber-", "goal": "Understand how Malay builds words from roots.", "blocks": [["p", "Most Malay words grow from a <b>root</b> (kata dasar) plus prefixes and suffixes. Learn the root once and you can decode a whole family. Dictionaries list words under their root."], ["t", ["Root", "Family"], [["ajar (teach)", "belajar (study) · mengajar (teach) · pelajar (student) · pelajaran (lesson) · pengajar (instructor)"], ["kerja (work)", "bekerja (to work) · pekerja (worker) · pekerjaan (occupation)"]]], ["h", "ber- : doing, having, being"], ["t", ["Use", "Root → ber-word", "Meaning"], [["intransitive action", "jalan → <b>berjalan</b>", "to walk"], ["", "main → <b>bermain</b>", "to play"], ["having / wearing", "baju → <b>berbaju</b> merah", "wearing a red shirt"], ["", "umur → <b>berumur</b> 25 tahun", "aged 25"], ["using (transport)", "basikal → <b>berbasikal</b>", "to cycle"], ["in a group of", "dua → <b>berdua</b>", "as a pair"]]], ["tip", "Spelling: <b>ber-</b> becomes <b>be-</b> before roots starting with <i>r</i> (<i>renang → berenang</i>, swim) or whose first syllable ends in <i>-er</i> (<i>kerja → bekerja</i>). One irregular: <i>ajar → <b>belajar</b></i>."], ["p", "In casual speech the prefix is often dropped: <i>Saya kerja di KL</i>, <i>Jom jalan!</i>"]], "quiz": [["'To swim' (root: renang)", ["berrenang", "berenang", "merenang", "renangan"], 1, "ber- → be- before r."], ["'Belajar' comes from which root?", ["lajar", "ajar", "bela", "jar"], 1, "Irregular: ber + ajar."], ["'Aged 30 years'", ["berumur 30 tahun", "umuran 30 tahun", "mengumur 30 tahun", "pengumur 30"], 0, "ber- = having."], ["'Pekerja' means…", ["job", "worker", "to work", "workplace"], 1, "pe- = the doer."]]}, {"stage": 2, "title": "The meN- prefix", "ms": "Awalan meN-", "goal": "Form active verbs and master the sound changes.", "blocks": [["p", "<b>meN-</b> marks an active verb that usually has an object: <i>Saya <b>membaca</b> buku</i>. The <b>N</b> changes shape depending on the first letter of the root — and some first letters disappear."], ["t", ["Root starts with", "Prefix", "Example"], [["l, m, n, r, w, y, ng, ny", "me-", "lihat → <b>melihat</b> (see) · masak → <b>memasak</b> (cook)"], ["b, f, v · <b>p</b> drops", "mem-", "beli → <b>membeli</b> · pakai → <b>memakai</b> (wear)"], ["c, d, j, z · <b>t</b> drops", "men-", "cari → <b>mencari</b> · tulis → <b>menulis</b>"], ["vowel, g, h, kh · <b>k</b> drops", "meng-", "ajar → <b>mengajar</b> · kira → <b>mengira</b> (count)"], ["<b>s</b> drops", "meny-", "sapu → <b>menyapu</b> (sweep) · simpan → <b>menyimpan</b>"], ["one-syllable roots", "menge-", "cat → <b>mengecat</b> (paint)"]]], ["tip", "Memory hook: the letters that drop are <b>K-T-S-P</b> — 'KiTa SePakat' (we agree). They only drop when followed by a vowel: <i>kritik → mengkritik</i>."], ["p", "Reverse it to look up words: <i>menulis</i> → drop <i>men-</i> → 'ulis' isn't a word → restore t → <b>tulis</b>."], ["p", "Everyday speech often uses the bare root: <i>Saya nak beli roti</i> sounds more natural than <i>membeli</i> in a shop."]], "quiz": [["meN- + tolong (help)", ["mentolong", "menolong", "metolong", "mengtolong"], 1, "t drops: menolong."], ["meN- + pukul (hit)", ["mempukul", "memukul", "menpukul", "mepukul"], 1, "p drops: memukul."], ["meN- + sewa (rent)", ["mensewa", "menyewa", "mesewa", "mengsewa"], 1, "s drops: menyewa."], ["Find the root of 'mengambil' (take)", ["kambil", "ambil", "gambil", "mbil"], 1, "Vowel roots take meng-: ambil."]]}, {"stage": 2, "title": "Suffixes -kan and -i", "ms": "Akhiran -kan & -i", "goal": "Add 'cause', 'for someone' and 'to a place' meanings to verbs.", "blocks": [["t", ["Suffix", "Main job", "Example"], [["-kan", "cause / make", "besar → mem<b>besarkan</b> (enlarge) · bersih → mem<b>bersihkan</b> (clean)"], ["-kan", "do for someone", "Tolong <b>belikan</b> saya kopi. (Buy coffee for me.)"], ["-kan", "move something", "<b>masukkan</b> beg (put the bag in) · <b>hantarkan</b> surat"], ["-i", "act on / towards a place or person", "<b>masuki</b> bilik (enter the room) · <b>dekati</b> (approach)"], ["-i", "repeated action", "<b>pukuli</b> (hit repeatedly)"], ["-i", "turns intransitive into transitive", "suka → <b>menyukai</b> (to like someone/thing) · hadir → <b>menghadiri</b> (attend)"]]], ["ex", [["Tolong bukakan pintu.", "Please open the door (for me)."], ["Dia menghadiri mesyuarat.", "She attended the meeting."], ["Saya perlu menandatangani borang ini.", "I need to sign this form."], ["Matikan lampu.", "Turn off the light."]]], ["tip", "Commands often use a root + <b>-kan</b> with no prefix: <i>tutupkan, hantarkan, matikan</i>. Add <b>tolong</b> in front to make them polite."]], "quiz": [["'Please close the window (for me)'", ["Tolong tutupi tingkap.", "Tolong tutupkan tingkap.", "Tolong menutup tingkap-kan.", "Tolong tertutup tingkap."], 1, "-kan = for someone."], ["'To attend' (root: hadir)", ["menghadirkan", "menghadiri", "berhadir", "terhadir"], 1, "-i makes it take an object."], ["'Memanaskan' (panas) means…", ["to be hot", "to heat up", "heater", "hottest"], 1, "-kan = cause."], ["'Masuki' vs 'masukkan': 'put it in the bag'", ["masuki ke dalam beg", "masukkan ke dalam beg", "masuk-i beg", "termasuk beg"], 1, "Moving an object: -kan."]]}, {"stage": 2, "title": "Passive voice", "ms": "Ayat pasif", "goal": "Understand the passive — Malaysians use it constantly.", "blocks": [["p", "Malay loves the passive, especially in writing and news. The rule depends on <b>who does the action</b>."], ["t", ["Doer", "Pattern", "Example"], [["3rd person / unknown", "<b>di-</b> + root (+ oleh …)", "Buku itu <b>dibaca</b> oleh Ali. — The book was read by Ali."], ["I / you / we", "pronoun + bare root", "Buku itu <b>saya baca</b>. — The book was read by me."]]], ["tip", "Don't say <s>dibaca oleh saya</s>. With I/you/we, put the pronoun right before the bare verb: <i>Kereta itu <b>kami</b> sewa.</i> (The car — we rented it.)"], ["ex", [["Kedai ini dibuka pada pukul 10.", "This shop is opened at 10."], ["Dompet saya dicuri.", "My wallet was stolen."], ["Makanan sudah dihantar.", "The food has been delivered."], ["Surat itu awak tulis?", "Did you write that letter?"]]], ["p", "You'll see <b>di-</b> on signs everywhere: <i>Dilarang merokok</i> (smoking prohibited), <i>Dilarang masuk</i> (no entry)."]], "quiz": [["'The car was repaired by the mechanic.'", ["Kereta itu dibaiki oleh mekanik.", "Kereta itu membaiki mekanik.", "Mekanik dibaiki kereta.", "Kereta itu terbaiki mekanik."], 0, "di- + root + oleh."], ["'The letter was written by me.'", ["Surat itu ditulis oleh saya.", "Surat itu saya tulis.", "Surat itu menulis saya.", "Saya ditulis surat."], 1, "Pronoun + bare root."], ["'Dilarang masuk' means…", ["Please enter", "Entrance", "No entry", "Enter quickly"], 2, "dilarang = is forbidden."], ["'My phone was stolen.'", ["Telefon saya mencuri.", "Telefon saya dicuri.", "Telefon saya pencuri.", "Telefon saya curian."], 1, "di- passive."]]}, {"stage": 2, "title": "ter-, pe- and noun-making", "ms": "Imbuhan kata nama", "goal": "Decode nouns and accidental actions.", "blocks": [["h", "ter- : three meanings"], ["t", ["Meaning", "Example"], [["most (superlative)", "<b>tercantik</b> = paling cantik — most beautiful"], ["accidental / sudden", "<b>tertidur</b> (dozed off) · <b>terlupa</b> (forgot) · <b>terjatuh</b> (fell)"], ["a state", "<b>terbuka</b> (open) · <b>tertutup</b> (closed) · <b>terletak</b> (is located)"]]], ["h", "Making nouns"], ["t", ["Pattern", "Meaning", "Examples"], [["root + -an", "result / thing", "makan → <b>makanan</b> (food) · jawab → <b>jawapan</b> (answer)"], ["peN-", "doer / tool", "<b>pemandu</b> (driver) · <b>penulis</b> (writer) · <b>pembaca</b> (reader)"], ["pe-", "doer (from ber- verbs)", "<b>pelajar</b> (student) · <b>pekerja</b> (worker)"], ["peN- … -an", "process", "<b>pendidikan</b> (education) · <b>penerbangan</b> (flight)"], ["pe- … -an", "result / matter", "<b>pelajaran</b> (lesson) · <b>pekerjaan</b> (job)"], ["ke- … -an", "abstract idea / event", "<b>kesihatan</b> (health) · <b>kebersihan</b> (cleanliness) · <b>kemalangan</b> (accident)"]]], ["tip", "peN- follows the same sound changes as meN-: <i>tulis → menulis → <b>penulis</b></i>; <i>pandu → memandu → <b>pemandu</b></i>."]], "quiz": [["'Saya tertidur' means…", ["I slept well", "I dozed off (accidentally)", "I'm sleepy", "I'm the sleepiest"], 1, "ter- = accidental."], ["'Driver' (root: pandu)", ["pandukan", "pemandu", "berpandu", "terpandu"], 1, "peN- → pem-, p drops."], ["'Kesihatan' means…", ["healthy", "health", "to heal", "hospital"], 1, "ke-…-an = abstract noun."], ["'The hotel is located in the city centre.'", ["Hotel itu diletak di pusat bandar.", "Hotel itu terletak di pusat bandar.", "Hotel itu meletak di pusat bandar.", "Hotel itu peletak pusat bandar."], 1, "ter- = state."]]}, {"stage": 3, "title": "Comparing things", "ms": "Perbandingan", "goal": "Say bigger, biggest, as big as.", "blocks": [["t", ["Pattern", "Meaning", "Example"], [["lebih … daripada", "more … than", "KL <b>lebih</b> besar <b>daripada</b> Ipoh."], ["kurang … daripada", "less … than", "Ini <b>kurang</b> pedas <b>daripada</b> itu."], ["paling … / ter-", "most", "<b>paling</b> sedap · <b>ter</b>sedap"], ["se- + adjective", "as … as", "Dia <b>setinggi</b> abangnya."], ["sama … dengan", "the same … as", "Harganya <b>sama</b> <b>dengan</b> semalam."], ["terlalu", "too", "<b>Terlalu</b> mahal."], ["agak", "rather / quite", "<b>Agak</b> jauh."], ["sangat / sekali / betul", "very", "<b>sangat</b> cantik · cantik <b>sekali</b> · cantik <b>betul</b>"]]], ["tip", "Casual speech replaces <i>daripada</i> with <b>dari</b>, and a shopper's favourite is <i>Ada yang <b>lebih murah</b>?</i> — Is there a cheaper one?"]], "quiz": [["'Penang is smaller than Johor.'", ["Penang paling kecil Johor.", "Penang lebih kecil daripada Johor.", "Penang kecil lebih Johor.", "Penang sekecil daripada Johor."], 1, "lebih … daripada."], ["'The most expensive'", ["lebih mahal", "paling mahal", "semahal", "sama mahal"], 1, "paling = most."], ["'As tall as' uses…", ["ter-", "se-", "pe-", "ke-"], 1, "setinggi = as tall as."], ["'Too spicy!'", ["Terlalu pedas!", "Paling pedas!", "Sepedas!", "Kurang pedas!"], 0, "terlalu = too."]]}, {"stage": 3, "title": "Politeness & forms of address", "ms": "Budi bahasa", "goal": "Speak respectfully and read social situations.", "blocks": [["p", "Malaysian culture values <b>budi bahasa</b> — courteous language. Much of it lives in how you address people."], ["t", ["Say", "To", "Casual form"], [["Encik", "a man (Mr.)", "—"], ["Puan", "a married / older woman (Mrs.)", "—"], ["Cik", "a young / unmarried woman (Miss)", "—"], ["Tuan", "a man of rank; formal 'sir'", "—"], ["abang", "a man a bit older than you; male waiter", "bang"], ["kakak", "a woman a bit older; female server", "kak"], ["adik", "someone younger", "dik"], ["pak cik / mak cik", "older man / woman ('uncle / auntie')", "—"]]], ["tip", "Use these <b>instead of 'you'</b>: <i>'Kak, nasi lemak satu.'</i> · <i>'Encik nak ke mana?'</i> Using <i>kamu</i> or <i>engkau</i> with an elder sounds rude."], ["h", "Softening requests"], ["t", ["Word", "Feel", "Example"], [["tolong", "please (help me)", "<b>Tolong</b> ambilkan air."], ["sila", "please (you may)", "<b>Sila</b> masuk."], ["minta", "may I have / request", "<b>Minta</b> bil. · Saya <b>minta</b> diri dulu (excuse me, I'll leave now)."], ["jemput", "invite / welcome", "<b>Jemput</b> makan."], ["boleh … ?", "could you…?", "<b>Boleh</b> tolong saya?"]]], ["p", "Body language: give and receive with the <b>right hand</b> (support it with the left for respect), point with your thumb, take shoes off indoors, and greet elders with a light handshake then touch your chest."]], "quiz": [["Calling a young female waiter, you say…", ["Mak cik!", "Kak!", "Encik!", "Tuan!"], 1, "Kak for an older-sister-aged woman."], ["A host says 'Jemput makan'. They mean…", ["Go away", "Please eat", "Buy food", "I'm hungry"], 1, "jemput = invite."], ["Politely leaving: 'Saya ___ diri dulu.'", ["tolong", "minta", "sila", "jemput"], 1, "minta diri = take one's leave."], ["Pointing politely uses…", ["index finger", "thumb", "foot", "chin"], 1, "Point with the right thumb."]]}, {"stage": 3, "title": "Everyday spoken Malay", "ms": "Bahasa pasar", "goal": "Understand how people really speak on the street.", "blocks": [["p", "Textbook Malay (<i>bahasa baku</i>) and street Malay are close, but locals shorten a lot. You'll hear these every day:"], ["t", ["Formal", "Spoken", "Meaning"], [["tidak", "tak", "not"], ["hendak / mahu", "nak", "want"], ["sudah", "dah", "already"], ["sahaja", "je", "only / just"], ["dekat / di", "kat", "at const spk = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s => String(s).replace(/<[^>]+>/g,'').replace(/^[AB]:\s*/,'');
let done = {};
try { done = JSON.parse(localStorage.getItem('malay-lessons-done')||'{}') || {}; } catch(e){}
const save = () => { try { localStorage.setItem('malay-lessons-done', JSON.stringify(done)); } catch(e){} };
const nav = document.getElementById('nav'), msel = document.getElementById('msel'), view = document.getElementById('view');
let cur = -1;

function renderNav(){
  let h = '', o = '<option value="-1">Course overview</option>';
  D.stages.forEach((st, si) => {
    const ls = D.lessons.map((l,i)=>[l,i]).filter(([l])=>l.stage===si);
    const n = ls.filter(([,i])=>done[i]).length;
    h += `<div class="a${si}"><div class="stage-h">${esc(st[0])}<span>${n}/${ls.length}</span></div>`;
    o += `<optgroup label="${esc(st[0])}">`;
    ls.forEach(([l,i]) => {
      h += `<button class="lnk ${done[i]?'done':''}" data-i="${i}" aria-current="${i===cur}"><span class="n">${done[i]?'✓':i+1}</span><span>${esc(l.title)}<small lang="ms">${esc(l.ms)}</small></span></button>`;
      o += `<option value="${i}">${i+1}. ${esc(l.title)}${done[i]?' ✓':''}</option>`;
    });
    h += `</div>`; o += `</optgroup>`;
  });
  nav.innerHTML = h; msel.innerHTML = o; msel.value = cur;
  const c = Object.keys(done).filter(k=>done[k]).length;
  document.querySelectorAll('.pct').forEach(e=>e.textContent = `${c}/${D.lessons.length}`);
  document.querySelectorAll('.track i').forEach(e=>e.style.width = (c/D.lessons.length*100)+'%');
}

function block(b){
  const [t, ...a] = b;
  if (t==='p') return `<div class="blk"><p>${a[0]}</p></div>`;
  if (t==='h') return `<h3 class="sub-h">${esc(a[0])}</h3>`;
  if (t==='tip') return `<div class="blk tipbox">${a[0]}</div>`;
  if (t==='t') { const hd = a[0].some(x=>x) ? `<thead><tr>${a[0].map(x=>`<th>${x}</th>`).join('')}</tr></thead>` : '';
    return `<div class="blk tbl"><table>${hd}<tbody>${a[1].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
  if (t==='ex') return `<div class="blk exs">${a[0].map(([m,e])=>`<div class="exl"><button class="spk" data-say="${esc(strip(m.split(' — ')[0]))}" aria-label="Listen">${spk}</button><div><div class="m" lang="ms">${esc(m)}</div><div class="e">${esc(e)}</div></div></div>`).join('')}</div>`;
  return '';
}

function overview(){
  return `<div class="wrap"><section class="hero motif a1"><div class="eyebrow">A beginner-to-fluent course · ${D.lessons.length} lessons</div><h1>Jalan ke Fasih</h1><p class="en-t">The road to fluent Malay</p>
  <div class="goal"><b>Progress</b> <span class="pct"></span> lessons complete</div></section>
  <div class="blk"><p>Four stages take you from your first <i>selamat pagi</i> to building words with prefixes and chatting like a local. Each lesson has clear tables, examples you can listen to, and a short quiz. Pair every lesson with a theme from the <a href="vocabulary.html" style="color:inherit;font-weight:700">Kata Asas</a> vocabulary deck and a scene from the <a href="phrases.html" style="color:inherit;font-weight:700">Frasa Harian</a> phrases deck.</p></div>
  ${D.stages.map((st,si)=>`<h3 class="sub-h">Stage ${si+1} · ${esc(st[0])}</h3><p style="color:var(--muted);margin:-6px 0 10px">${esc(st[1])}</p><div class="overview a${si}">${D.lessons.map((l,i)=>[l,i]).filter(([l])=>l.stage===si).map(([l,i])=>`<button class="ov" data-i="${i}"><span class="eyebrow">Lesson ${i+1}${done[i]?' · ✓ done':''}</span><b lang="ms">${esc(l.ms)}</b><span>${esc(l.title)}</span></button>`).join('')}</div>`).join('')}
  <div class="pager"><span></span><button class="btn primary" data-i="0">Start lesson 1 →</button></div></div>`;
}

function lesson(i){
  const l = D.lessons[i], acc = 'a'+l.stage;
  const quiz = l.quiz.map((q,qi)=>`<div class="q" data-q="${qi}"><p>${qi+1}. ${q[0]}</p><div class="opts">${q[1].map((o,oi)=>`<button class="opt" data-o="${oi}" lang="ms">${esc(o)}</button>`).join('')}</div><div class="fb" hidden></div></div>`).join('');
  return `<div class="wrap ${acc}"><section class="hero motif"><div class="eyebrow">Stage ${l.stage+1} · ${esc(D.stages[l.stage][0])} · Lesson ${i+1} of ${D.lessons.length}</div>
  <h1 lang="ms">${esc(l.ms)}</h1><p class="en-t">${esc(l.title)}</p><div class="goal"><b>Goal</b> ${esc(l.goal)}</div></section>
  ${l.blocks.map(block).join('')}
  <section class="quiz" id="quiz"><div class="eyebrow">Latihan · Practice</div><h2>Check yourself</h2>${quiz}
  <div class="score"><b id="sc">0 / ${l.quiz.length}</b><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="retry">Try again</button><button class="btn primary" id="mark">${done[i]?'✓ Completed':'Mark lesson complete'}</button></div></div></section>
  <div class="pager">${i>0?`<button class="btn" data-i="${i-1}">← ${esc(D.lessons[i-1].title)}</button>`:`<button class="btn" data-i="-1">← Overview</button>`}${i<D.lessons.length-1?`<button class="btn primary" data-i="${i+1}">${esc(D.lessons[i+1].title)} →</button>`:`<button class="btn primary" data-i="-1">Finish · Overview</button>`}</div></div>`;
}

function go(i){
  cur = i; view.innerHTML = i<0 ? overview() : lesson(i);
  renderNav(); window.scrollTo(0,0);
  try { localStorage.setItem('malay-lessons-cur', i); } catch(e){}
  if (i>=0) { const l = D.lessons[i]; let score = 0, answered = 0;
    view.querySelectorAll('.q').forEach(qe => {
      const q = l.quiz[+qe.dataset.q];
      qe.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const oi = +b.dataset.o, ok = oi===q[2];
        qe.querySelectorAll('.opt').forEach((x,xi)=>{ x.disabled = true; if (xi===q[2]) x.classList.add('right'); });
        if (!ok) b.classList.add('wrong');
        const fb = qe.querySelector('.fb'); fb.hidden = false; fb.innerHTML = `<b class="${ok?'ok':'no'}">${ok?'Betul! Correct.':'Not quite.'}</b> ${q[3]}`;
        answered++; if (ok) score++;
        document.getElementById('sc').textContent = `${score} / ${l.quiz.length}${answered===l.quiz.length?(score===l.quiz.length?' · Syabas! Perfect.':' · Review the tips above and retry'):''}`;
        if (answered===l.quiz.length && score===l.quiz.length && !done[i]) { done[i]=true; save(); renderNav(); document.getElementById('mark').textContent='✓ Completed'; }
      });
    });
    document.getElementById('retry').onclick = () => { const y = document.getElementById('quiz').offsetTop; go(i); window.scrollTo(0,y-20); };
    document.getElementById('mark').onclick = e => { done[i] = !done[i]; save(); renderNav(); e.target.textContent = done[i]?'✓ Completed':'Mark lesson complete'; };
  }
}

let voice=null;
function pick(){ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/malay/i.test(v.name)) || vs.find(v=>/^id/i.test(v.lang)) || null; }
if ('speechSynthesis' in window){ pick(); speechSynthesis.onvoiceschanged = pick; }
function say(t){ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t.replace(/\s*\/\s*/g,', ')); u.lang = voice?voice.lang:'ms-MY'; if(voice) u.voice=voice; u.rate=.9; speechSynthesis.speak(u); }

document.addEventListener('click', e => {
  const s = e.target.closest('[data-say]'); if (s) { say(s.dataset.say); return; }
  const g = e.target.closest('[data-i]'); if (g) go(+g.dataset.i);
});
msel.onchange = () => go(+msel.value);
let start = -1; try { const v = parseInt(localStorage.getItem('malay-lessons-cur')); if (v>=-1 && v<D.lessons.length) start = v; } catch(e){}
go(start);
</script>
