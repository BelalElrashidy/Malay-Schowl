<style>
:root{
  --ground:#F2F4F1; --panel:#FFFFFF; --ink:#15213B; --muted:#5A6477; --line:#DCE1E6;
  --red:#C23A2E; --green:#2E7A58; --gold:#A26C0B; --indigo:#2F4B8A;
  --red-soft:#F8E4E1; --green-soft:#DFF0E7; --gold-soft:#F8EDD5; --indigo-soft:#E2E8F5;
  --shadow:0 1px 2px rgba(21,33,59,.06),0 8px 28px rgba(21,33,59,.08);
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1320; --panel:#161E2E; --ink:#E8ECF3; --muted:#9AA5B8; --line:#263047;
  --red:#EE7A6C; --green:#5FC194; --gold:#E9B650; --indigo:#8FA8E6;
  --red-soft:#3A1F1E; --green-soft:#16332A; --gold-soft:#3A2E15; --indigo-soft:#1D2946;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0D1320; --panel:#161E2E; --ink:#E8ECF3; --muted:#9AA5B8; --line:#263047;
  --red:#EE7A6C; --green:#5FC194; --gold:#E9B650; --indigo:#8FA8E6;
  --red-soft:#3A1F1E; --green-soft:#16332A; --gold-soft:#3A2E15; --indigo-soft:#1D2946;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}

.home{font:600 13px var(--body);color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:4px 2px}
.home:hover{color:var(--ink)}
.home:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.theme-btn svg{flex:none}
#slowtoggle[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
@media (max-width:560px){.theme-btn .theme-label{display:none}.name em{display:none}}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;margin:0;line-height:1.5}
*{box-sizing:border-box}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.name{font-family:var(--display);font-size:19px;margin-right:auto;white-space:nowrap}
.name em{font-style:normal;color:var(--muted);font-family:var(--body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding:8px 16px;margin:0 auto;max-width:980px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;white-space:nowrap;padding:8px 14px;border-radius:999px;font:600 14px var(--body);color:var(--muted);display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ground)}
.tab:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:20px 16px 64px}
.deckbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.deckbar .grow{flex:1;min-width:180px}
select{width:100%;font:600 14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pill{font:600 12px var(--mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-variant-numeric:tabular-nums}
.btn{font:600 14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn:focus-visible,select:focus-visible,input:focus-visible,.card:focus-visible,.tile:focus-visible,.opt:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));width:0;transition:width .35s}
.bar u{position:absolute;inset:0 auto 0 0;height:100%;background:var(--green);width:0;transition:width .35s}
.btn.tiny{font-size:12px;padding:5px 11px}
.override{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.override span{font-size:13px;color:var(--muted)}
.tagdir{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h3.h{font-family:var(--display);font-weight:400;font-size:25px;margin:32px 0 10px}
.sched{display:flex;gap:8px;align-items:flex-end;justify-content:space-between}
.sched .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end}
.sched .col{width:100%;max-width:46px;border-radius:6px 6px 0 0;background:var(--indigo);opacity:.85}
.sched b{font:500 13px var(--mono)}
.sched span{font-size:11px;color:var(--muted)}

/* flashcards */
.card{all:unset;box-sizing:border-box;display:grid;place-items:center;text-align:center;width:100%;min-height:min(62vh,440px);background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:34px 24px;cursor:pointer;position:relative;perspective:1000px}
.card:hover{box-shadow:0 2px 4px rgba(21,33,59,.08),0 14px 40px rgba(21,33,59,.12)}
.card .side{display:grid;gap:14px;justify-items:center}
.card .em{font-size:clamp(64px,13vw,120px);line-height:1}
.card .big{font-family:var(--display);font-weight:400;font-size:clamp(34px,6.5vw,66px);line-height:1.05;margin:0;overflow-wrap:anywhere}
.card .small{font-size:17px;color:var(--muted);max-width:46ch}
.card .flip-hint{position:absolute;bottom:16px;left:0;right:0;font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card .corner{position:absolute;top:18px;left:16px;right:96px;text-align:left;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cardtools{position:absolute;top:10px;right:12px;display:flex;gap:6px}
.icon{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--ground)}
.icon:hover{color:var(--ink);border-color:var(--muted)}
.icon.on{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.icon svg{width:18px;height:18px}
.rowc{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}

/* learn / write / test */
.panel{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:clamp(20px,4vw,34px)}
.prompt{font-family:var(--display);font-weight:400;font-size:clamp(30px,5.5vw,54px);line-height:1.05;margin:10px 0 6px;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:15px;margin:0}
.eyebrow{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:22px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);background:var(--ground);border-radius:14px;padding:14px 16px;font-size:16px;font-weight:500;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .k{font:600 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.answerbox{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:200px;font:500 19px var(--body);color:var(--ink);background:var(--ground);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px}
.verdict{margin-top:18px;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.6}
.verdict.ok{background:var(--green-soft);border:1px solid var(--green)}
.verdict.no{background:var(--red-soft);border:1px solid var(--red)}
.verdict b{display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.verdict .corr{font-family:var(--display);font-size:24px}

/* match */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;min-height:92px;display:grid;place-items:center;text-align:center;padding:12px;border:1.5px solid var(--line);background:var(--panel);border-radius:16px;font-size:16px;font-weight:600;line-height:1.3}
.tile.ms{font-family:var(--display);font-weight:400;font-size:20px}
.tile:hover{border-color:var(--indigo)}
.tile.sel{border-color:var(--indigo);background:var(--indigo-soft)}
.tile.bad{border-color:var(--red);background:var(--red-soft);animation:shake .3s}
.tile.gone{opacity:0;pointer-events:none;transform:scale(.9);transition:.3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{display:block;font:500 30px var(--mono);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.themes{margin-top:22px;display:grid;gap:10px}
.theme{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.theme .t{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.theme .t span{color:var(--muted);font-weight:500;font:500 13px var(--mono)}
.wordlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.wchip{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.wchip span{color:var(--muted);font-size:13px}
.lvl{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lvl.l1{background:var(--red)}.lvl.l2{background:var(--gold)}.lvl.l3{background:var(--green)}.lvl.l4{background:var(--indigo)}
textarea{width:100%;font:500 13px var(--mono);color:var(--ink);background:var(--ground);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;resize:vertical}
.empty{color:var(--muted);font-size:15px;text-align:center;padding:40px 10px}
.hintline{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
@media (max-width:640px){.hintline{display:none}.name em{display:none}}
.summary{text-align:center;display:grid;gap:14px;justify-items:center;padding:20px 0}
.summary .score{font-family:var(--display);font-size:clamp(46px,10vw,82px);line-height:1}
.review{display:grid;gap:8px;margin-top:18px;text-align:left}
.rev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;border-radius:12px;padding:10px 14px;background:var(--ground)}
.rev.no{background:var(--red-soft)}
.rev .m{font-weight:700}
.rev .e{color:var(--muted);font-size:14px}
</style>

/* ───── spaced repetition store ───── */
const DAY = 864e5;
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset()*6e4) / DAY);
const GAPS = [0, 1, 2, 5, 12, 30];
let P = {}, best = {};
const LS = {
  load(){ try{ P = JSON.parse(localStorage.getItem('hafal-p2')||'{}')||{}; best = JSON.parse(localStorage.getItem('hafal-best')||'{}')||{}; }catch(e){ P={}; best={}; } },
  save(){ try{ localStorage.setItem('hafal-p2', JSON.stringify(P)); }catch(e){} },
  saveBest(){ try{ localStorage.setItem('hafal-best', JSON.stringify(best)); }catch(e){} },
  pref(k, v){ try{ if (v === undefined) return localStorage.getItem('hafal-'+k); localStorage.setItem('hafal-'+k, v); }catch(e){ return null; } }
};
LS.load();
const rec = m => (P[m] = P[m] || {n:0, d:0, w:0, t:0, s:false});
const strength = m => P[m] ? P[m].n : 0;
const isDue = m => P[m] && P[m].t > 0 && P[m].d <= today();
const isMastered = m => strength(m) >= 4;
function grade(m, ok){
  const r = rec(m), before = {...r};
  if (ok) { r.n = Math.min(5, r.n + 1); r.d = today() + GAPS[r.n]; }
  else { r.n = Math.max(0, r.n - 1); r.d = today(); r.w++; }
  r.t++; LS.save(); return before;
}
function regrade(m, before, ok){ P[m] = {...before}; grade(m, ok); }

let voice = null, audioOn = LS.pref('audio') !== '0', slowOn = LS.pref('slow') === '1';
function pickVoice(){ const v = speechSynthesis.getVoices(); voice = v.find(x=>/^ms/i.test(x.lang)) || v.find(x=>/malay/i.test(x.name)) || v.find(x=>/^id/i.test(x.lang)) || null; }
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, force){
  if (!('speechSynthesis' in window) || (!audioOn && !force)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/\s*\/\s*/g, ', ').replace(/\(.*?\)/g,''));
  u.lang = voice ? voice.lang : 'ms-MY'; if (voice) u.voice = voice; u.rate = slowOn ? .6 : .92;
  speechSynthesis.speak(u);
}

/* ───── answer checking ───── */
const strip = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/\(.*?\)/g,' ').replace(/[^a-z0-9\s']/g,' ').replace(/\s+/g,' ').trim();
const loose = s => strip(s).replace(/^(to|a|an|the)\s+/,'').replace(/\s+(it|them|someone|something)$/,'');
const alts = s => String(s).split(/[\/,]/).map(x=>x.trim()).filter(Boolean);
function lev(a,b){ const m=a.length,n=b.length; if (Math.abs(m-n)>2) return 3; let p=[...Array(n+1).keys()],c=[];
  for(let i=1;i<=m;i++){ c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function check(input, answer){
  const got = loose(input); if (!got) return 'no';
  const list = alts(answer).map(loose).filter(Boolean);
  if (list.includes(got)) return 'yes';
  for (const want of list) if (want.length > 3 && lev(got, want) <= 1) return 'typo';
  for (const want of list) { const parts = want.split(' ');
    if (parts.length > 1 && parts.includes(got) && got.length > 2) return 'yes'; }
  return 'no';
}

const CATS = [];
(() => { const seen = new Map();
  TERMS.forEach(t => { const k = t.l + '§' + t.c; seen.set(k, (seen.get(k)||0)+1); });
  [...seen].forEach(([k,n]) => { const [l,c] = k.split('§'); CATS.push({id:'c'+k, label:c, level:l, count:n}); });
})();
function deckItems(id){
  id = id || deckId;
  if (id === 'due') return TERMS.filter(t => isDue(t.m));
  if (id === 'weak') return TERMS.filter(t => P[t.m] && P[t.m].t > 0 && strength(t.m) <= 1).sort((a,b)=>(P[b.m].w||0)-(P[a.m].w||0));
  if (id === 'starred') return TERMS.filter(t => P[t.m] && P[t.m].s);
  if (id === 'unseen') return TERMS.filter(t => !P[t.m] || !P[t.m].t);
  if (id === 'allwords') return TERMS.filter(t => t.l !== 'P');
  if (id === 'P') return TERMS.filter(t => t.l === 'P');
  if (/^L[1-6]$/.test(id)) return TERMS.filter(t => String(t.l) === id[1]);
  if (id.startsWith('c')) { const [l,c] = id.slice(1).split('§'); return TERMS.filter(t => String(t.l) === l && t.c === c); }
  return TERMS.filter(t => t.l === 1);
}
function buildDeckSelect(){
  const n = id => deckItems(id).length;
  const lvlOpts = [1,2,3,4,5,6].map(l => {
    const items = deckItems('L'+l), m = items.filter(t=>isMastered(t.m)).length;
    return `<option value="L${l}">Level ${l} · ${esc(LEVELS[l])} — ${items.length} words (${m} mastered)</option>`;
  }).join('');
  const catGroup = l => `<optgroup label="Level ${l} topics">${CATS.filter(c=>c.level===String(l)).map(c=>`<option value="${esc(c.id)}">L${l} · ${esc(c.label)} (${c.count})</option>`).join('')}</optgroup>`;
  deckSel.innerHTML = `
    <optgroup label="Review queue">
      <option value="due">⏰ Due for review today — ${n('due')}</option>
      <option value="weak">⚠︎ Needs work — ${n('weak')}</option>
      <option value="starred">★ Starred — ${n('starred')}</option>
      <option value="unseen">◦ Not studied yet — ${n('unseen')}</option>
    </optgroup>
    <optgroup label="Levels">${lvlOpts}
      <option value="allwords">All words — ${n('allwords')}</option>
      <option value="P">Phrases in context — ${n('P')}</option></optgroup>
    ${[1,2,3,4,5,6].map(catGroup).join('')}
    <optgroup label="Phrase situations">${CATS.filter(c=>c.level==='P').map(c=>`<option value="${esc(c.id)}">${esc(c.label)} (${c.count})</option>`).join('')}</optgroup>`;
  deckSel.value = deckId;
  if (!deckSel.value) { deckId = 'L1'; deckSel.value = deckId; }
}

}
const refreshCount = () => headline();

/* ── Flashcards — the only mode with a picture ── */
function cards(items){
  S.list = shuffle ? shuf(items) : items; S.i = 0; S.flip = false; S.dirs = {};
  const draw = () => {
    const it = S.list[S.i];
    if (S.dirs[S.i] === undefined) S.dirs[S.i] = nextDir(); else curDir = S.dirs[S.i];
    const st = P[it.m] && P[it.m].s, r = P[it.m];
    const due = r && r.t ? (r.d <= today() ? 'due now' : `next review in ${r.d - today()}d`) : 'new';
    view.innerHTML = `
      <div class="bar"><i style="width:${(S.i+1)/S.list.length*100}%"></i></div>
      <div style="position:relative;margin-top:14px">
        <button class="card" id="card">
          <span class="corner">${esc(String(it.l)==='P'?'Phrase':'Level '+it.l)} · ${esc(it.c)} · ${S.i+1}/${S.list.length} · ${due}</span>
          ${S.flip ? `<span class="side">
              ${it.em?`<span class="em">${it.em}</span>`:''}
              <h2 class="big">${esc(back(it))}</h2>
              ${it.x?`<p class="small"><b>${esc(it.x)}</b><br>${esc(it.xe)}</p>`:''}
              ${it.n?`<p class="small">${esc(it.n)}</p>`:''}</span>`
            : `<span class="side">
              ${(it.em && curDir==='ms')?`<span class="em">${it.em}</span>`:''}
              <h2 class="big">${esc(front(it))}</h2>
              <span class="tagdir">${curDir==='ms'?'Malay → English':'English → Malay'}</span></span>`}
          <span class="flip-hint">Click or press space to flip</span>
        </button>
        <div class="cardtools">
          <button class="icon" id="sayit" aria-label="Listen">${SPK}</button>
          <button class="icon ${st?'on':''}" id="star" aria-label="Star this term" aria-pressed="${!!st}">${STAR}</button>
        </div>
      </div>
      <div class="rowc">
        <button class="btn" id="prev">←</button>
        <button class="btn" id="again">Still learning</button>
        <button class="btn primary" id="got">I knew it ✓</button>
        <button class="btn" id="next">→</button>
      </div>
      <p class="hintline">Space flip · ← → move · S star · L listen · 1 still learning · 2 knew it</p>`;
    if (curDir === 'ms' && !S.flip) say(it.m);
    document.getElementById('card').onclick = () => { S.flip = !S.flip; draw(); if (S.flip) say(it.m); };
    document.getElementById('sayit').onclick = e => { e.stopPropagation(); say(it.m, true); };
    document.getElementById('star').onclick = e => { e.stopPropagation(); const r2 = rec(it.m); r2.s = !r2.s; LS.save(); draw(); };
    document.getElementById('prev').onclick = () => move(-1);
    document.getElementById('next').onclick = () => move(1);
    document.getElementById('got').onclick = () => { grade(it.m, true); move(1); };
    document.getElementById('again').onclick = () => { grade(it.m, false); move(1); };
  };
  const move = d => { S.flip = false; S.i = (S.i + d + S.list.length) % S.list.length; draw(); refreshCount(); };
  S.keys = e => {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('card').click(); }
    else if (e.key === 'ArrowRight') move(1); else if (e.key === 'ArrowLeft') move(-1);
    else if (e.key.toLowerCase() === 's') document.getElementById('star').click();
    else if (e.key.toLowerCase() === 'l') say(S.list[S.i].m, true);
    else if (e.key === '1') document.getElementById('again').click();
    else if (e.key === '2') document.getElementById('got').click();
  };
  draw();
}

/* ── Learn ── */
function learn(items){
  const due = items.filter(t => isDue(t.m));
  const rest = items.filter(t => !isDue(t.m)).sort((a,b) => strength(a.m) - strength(b.m) || Math.random()-.5);
  const picked = [...shuf(due).slice(0,7), ...rest].slice(0, Math.min(10, items.length));
  S.queue = shuf(picked); S.n = 0; S.right = 0; S.miss = [];
  S.ask = () => {
    if (S.n >= S.queue.length) return S.done();
    const it = S.queue[S.n]; nextDir();
    const typed = strength(it.m) >= 2 || !!it.redo;
    const others = shuf(items.filter(x => x.m !== it.m && x.e !== it.e)).slice(0,3);
    const opts = shuf([it, ...others]);
    view.innerHTML = `
      <div class="bar"><i style="width:${S.n/S.queue.length*100}%"></i></div>
      <div class="panel" style="margin-top:14px">
        <div class="eyebrow">Learn · ${S.n+1} of ${S.queue.length} · ${esc(it.c)}${isDue(it.m)?' · review':''}${it.redo?' · second try':''}</div>
        <p class="sub" style="margin-top:10px">${typed ? (curDir==='ms'?'Type the English':'Type the Malay') : 'Choose the answer'}</p>
        <h2 class="prompt">${esc(front(it))}</h2>
        ${typed
          ? `<div class="answerbox"><input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Your answer"><button class="btn primary" id="sub">Check</button><button class="btn ghost" id="skip">Don't know</button></div>`
          : `<div class="opts">${opts.map((o,i)=>`<button class="opt" data-m="${esc(o.m)}"><span class="k">${i+1}</span>${esc(back(o))}</button>`).join('')}</div>`}
        <div id="fb"></div>
      </div>`;
    if (curDir === 'ms') say(it.m);
    const after = (ok, msg) => {
      const before = grade(it.m, ok);
      if (ok) S.right++; else { S.miss.push(it); if (!it.redo) S.queue.push({...it, redo:true}); }
      const fb = document.getElementById('fb');
      fb.innerHTML = `<div class="verdict ${ok?'ok':'no'}"><b>${ok?'Betul · correct':'Not quite'}</b>${msg||''}
        <div class="corr">${esc(it.m)}</div><div>${esc(it.e)}</div>
        ${it.x?`<div style="margin-top:6px">${esc(it.x)} — ${esc(it.xe)}</div>`:''}${it.n?`<div style="margin-top:6px">${esc(it.n)}</div>`:''}
        ${overrideRow()}
        <div style="margin-top:12px"><button class="btn primary" id="nx">Continue →</button></div></div>`;
      wireOverride(fb, it.m, before, newOk => {
        if (newOk && !ok) { S.right++; S.miss = S.miss.filter(x => x !== it); }
        if (!newOk && ok) { S.right--; S.miss.push(it); }
      });
      say(it.m);
      document.getElementById('nx').onclick = () => { S.n++; S.ask(); };
      document.getElementById('nx').focus(); refreshCount();
    };
    if (typed) {
      const inp = document.getElementById('ans'); inp.focus();
      const go = () => { const v = inp.value, r = check(v, back(it));
        after(r !== 'no', r === 'typo' ? 'Close — check the spelling. ' : (r === 'no' && v.trim() ? `You wrote “${esc(v.trim())}”. ` : '')); };
      document.getElementById('sub').onclick = go;
      inp.onkeydown = e => { if (e.key === 'Enter') go(); };
      document.getElementById('skip').onclick = () => after(false, '');
    } else {
      view.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const ok = b.dataset.m === it.m;
        view.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.m === it.m) x.classList.add('right'); });
        if (!ok) b.classList.add('wrong');
        after(ok, '');
      });
    }
    S.keys = e => { if (!typed && /^[1-4]$/.test(e.key)) { const b = view.querySelectorAll('.opt')[+e.key-1]; if (b && !b.disabled) b.click(); }
      else if (e.key === 'Enter') { const nx = document.getElementById('nx'); if (nx) nx.click(); } };
  };
  S.done = () => {
    view.innerHTML = `<div class="panel summary">
      <div class="eyebrow">Round complete</div>
      <div class="score">${S.right} / ${S.queue.length}</div>
      <p class="sub">${S.right === S.queue.length ? 'Sempurna — every one right.' : 'Missed terms came back once this round, and are queued again for tomorrow.'}</p>
      <div class="rowc"><button class="btn primary" id="again">Next round →</button><button class="btn" id="tocards">Review as flashcards</button></div>
      ${S.miss.length?`<div class="review">${S.miss.map(m=>`<div class="rev no"><button class="icon" data-say="${esc(m.m)}">${SPK}</button><div><div class="m">${esc(m.m)}</div><div class="e">${esc(m.e)}</div></div></div>`).join('')}</div>`:''}
    </div>`;
    document.getElementById('again').onclick = () => render();
    document.getElementById('tocards').onclick = () => { mode = 'cards'; LS.pref('mode','cards'); render(); };
    view.querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say, true));
    refreshCount();
  };
  S.ask();
}

/* ── Write ── */
function write(items){
  const due = items.filter(t => isDue(t.m));
  S.list = shuf([...due, ...shuf(items)]); S.i = 0; S.right = 0; S.miss = [];
  const limit = Math.min(15, items.length);
  S.ask = () => {
    if (S.i >= limit) {
      view.innerHTML = `<div class="panel summary"><div class="eyebrow">Writing drill done</div><div class="score">${S.right} / ${limit}</div>
        <p class="sub">Malay spells what it says — if you can hear it, you can write it.</p>
        <div class="rowc"><button class="btn primary" id="again">Another ${limit} →</button></div>
        ${S.miss.length?`<div class="review">${S.miss.map(m=>`<div class="rev no"><button class="icon" data-say="${esc(m.m)}">${SPK}</button><div><div class="m">${esc(m.m)}</div><div class="e">${esc(m.e)}</div></div></div>`).join('')}</div>`:''}</div>`;
      document.getElementById('again').onclick = () => render();
      view.querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say, true));
      return refreshCount();
    }
    const it = S.list[S.i]; nextDir();
    view.innerHTML = `<div class="bar"><i style="width:${S.i/limit*100}%"></i></div>
      <div class="panel" style="margin-top:14px">
        <div class="eyebrow">Write · ${S.i+1} of ${limit} · ${esc(it.c)}</div>
        <p class="sub" style="margin-top:10px">Write it ${curDir==='ms'?'in English':'in Malay'}</p>
        <h2 class="prompt">${esc(front(it))}</h2>
        <div class="answerbox"><input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type here, then Enter">
          <button class="btn primary" id="sub">Check</button><button class="btn ghost" id="skip">Don't know</button></div>
        <div id="fb"></div></div>`;
    if (curDir === 'ms') say(it.m);
    const inp = document.getElementById('ans'); inp.focus();
    const done = (ok, msg) => {
      const before = grade(it.m, ok);
      if (ok) S.right++; else S.miss.push(it);
      const fb = document.getElementById('fb');
      fb.innerHTML = `<div class="verdict ${ok?'ok':'no'}"><b>${ok?'Betul · correct':'Correct answer'}</b>${msg||''}
        <div class="corr">${esc(it.m)}</div><div>${esc(it.e)}</div>
        ${it.x?`<div style="margin-top:6px">${esc(it.x)} — ${esc(it.xe)}</div>`:''}${it.n?`<div style="margin-top:6px">${esc(it.n)}</div>`:''}
        ${overrideRow()}
        <div style="margin-top:12px"><button class="btn primary" id="nx">Continue →</button></div></div>`;
      wireOverride(fb, it.m, before, newOk => {
        if (newOk && !ok) { S.right++; S.miss = S.miss.filter(x => x !== it); }
        if (!newOk && ok) { S.right--; S.miss.push(it); }
      });
      say(it.m);
      document.getElementById('nx').onclick = () => { S.i++; S.ask(); }; document.getElementById('nx').focus();
    };
    const go = () => { const v = inp.value, r = check(v, back(it)); done(r !== 'no', r === 'typo' ? 'Almost — one letter off. ' : ''); };
    document.getElementById('sub').onclick = go;
    document.getElementById('skip').onclick = () => done(false, '');
    inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    S.keys = e => { if (e.key === 'Enter') { const nx = document.getElementById('nx'); if (nx) nx.click(); } };
  };
  S.ask();
}

/* ── Match ── */
function match(items){
  const pairs = shuf(items).slice(0, Math.min(6, items.length));
  S.start = null; S.left = pairs.length; S.sel = null; S.timer = null;
  const tiles = shuf([...pairs.map(p=>({t:p.m, id:p.m, ms:true})), ...pairs.map(p=>({t:p.e, id:p.m, ms:false}))]);
  view.innerHTML = `<div class="panel">
      <div class="eyebrow">Match · tap a Malay term, then its meaning</div>
      <div style="display:flex;gap:14px;align-items:baseline;margin-top:8px"><div class="prompt" id="clock" style="font-size:40px">0.0s</div>
      <div class="sub">${best[deckId]?`Your best: ${best[deckId].toFixed(1)}s`:'No best time yet'}</div></div>
      <div class="grid" id="grid">${tiles.map((t,i)=>`<button class="tile ${t.ms?'ms':''}" data-i="${i}" data-id="${esc(t.id)}">${esc(t.t)}</button>`).join('')}</div>
      <div class="rowc"><button class="btn" id="re">↻ New round</button></div></div>`;
  const clock = document.getElementById('clock');
  document.getElementById('re').onclick = () => { clearInterval(S.timer); render(); };
  document.getElementById('grid').onclick = e => {
    const b = e.target.closest('.tile'); if (!b || b.classList.contains('gone')) return;
    if (!S.start) { S.start = Date.now(); S.timer = setInterval(()=>{ clock.textContent = ((Date.now()-S.start)/1000).toFixed(1)+'s'; }, 100); }
    if (b.classList.contains('ms')) say(b.textContent);
    if (!S.sel) { S.sel = b; b.classList.add('sel'); return; }
    if (S.sel === b) { b.classList.remove('sel'); S.sel = null; return; }
    const a = S.sel; S.sel = null; a.classList.remove('sel');
    if (a.dataset.id === b.dataset.id && a.classList.contains('ms') !== b.classList.contains('ms')) {
      a.classList.add('gone'); b.classList.add('gone'); grade(a.dataset.id, true); S.left--;
      if (!S.left) {
        clearInterval(S.timer); const t = (Date.now()-S.start)/1000;
        const isBest = !best[deckId] || t < best[deckId]; if (isBest) { best[deckId] = t; LS.saveBest(); }
        view.innerHTML = `<div class="panel summary"><div class="eyebrow">Siap · finished</div><div class="score">${t.toFixed(1)}s</div>
          <p class="sub">${isBest ? 'New best time for this set!' : `Your best for this set: ${best[deckId].toFixed(1)}s`}</p>
          <div class="rowc"><button class="btn primary" id="again">Play again →</button></div></div>`;
        document.getElementById('again').onclick = () => render();
        refreshCount();
      }
    } else { [a,b].forEach(x=>{ x.classList.add('bad'); setTimeout(()=>x.classList.remove('bad'), 320); }); grade(a.dataset.id, false); }
  };
}

/* ── Test ── */
function test(items){
  const n = Math.min(12, items.length);
  const due = items.filter(t => isDue(t.m));
  const pool = [...shuf(due).slice(0,6), ...shuf(items)];
  const picked = []; const used = new Set();
  for (const t of pool) { if (used.has(t.m)) continue; used.add(t.m); picked.push(t); if (picked.length === n) break; }
  S.qs = picked.map((it, i) => {
    const d = dirMode === 'mix' ? (Math.random() < .5 ? 'ms' : 'en') : dirMode;
    const kind = i % 4 === 3 ? 'type' : (i % 4 === 2 ? 'tf' : 'mc');
    const others = shuf(items.filter(x => x.m !== it.m && x.e !== it.e)).slice(0,3);
    if (kind === 'mc') return {kind, it, d, opts: shuf([it, ...others])};
    if (kind === 'tf') { const flip = Math.random() < .5 && others.length; return {kind, it, d, shown: flip ? others[0].e : it.e, truth: !flip}; }
    return {kind, it, d};
  });
  const f = q => q.d === 'ms' ? q.it.m : q.it.e, bk = q => q.d === 'ms' ? q.it.e : q.it.m;
  view.innerHTML = `<div class="panel">
    <div class="eyebrow">Test · ${n} questions</div>
    <p class="sub" style="margin-top:8px">Answer everything, then submit. You can override any judgement afterwards.</p>
    <div id="qs">${S.qs.map((q,i)=>{
      const head = `<div class="eyebrow" style="color:var(--muted)">${i+1} · ${q.kind==='type'?'Write it':q.kind==='tf'?'True or false':'Multiple choice'}</div>`;
      if (q.kind === 'mc') return `<div class="q" data-i="${i}" style="padding:20px 0;border-top:1px solid var(--line)">${head}
        <h3 class="prompt" style="font-size:clamp(24px,4vw,36px)">${esc(f(q))}</h3>
        <div class="opts">${q.opts.map(o=>`<button class="opt" data-pick="${esc(o.m)}">${esc(q.d==='ms'?o.e:o.m)}</button>`).join('')}</div></div>`;
      if (q.kind === 'tf') return `<div class="q" data-i="${i}" style="padding:20px 0;border-top:1px solid var(--line)">${head}
        <h3 class="prompt" style="font-size:clamp(22px,3.4vw,32px)">${esc(q.it.m)} = ${esc(q.shown)}</h3>
        <div class="opts"><button class="opt" data-pick="true">✓ True</button><button class="opt" data-pick="false">✗ False</button></div></div>`;
      return `<div class="q" data-i="${i}" style="padding:20px 0;border-top:1px solid var(--line)">${head}
        <h3 class="prompt" style="font-size:clamp(24px,4vw,36px)">${esc(f(q))}</h3>
        <div class="answerbox"><input type="text" data-type="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Write it ${q.d==='ms'?'in English':'in Malay'}"></div></div>`;
    }).join('')}</div>
    <div class="rowc" style="margin-top:20px"><button class="btn primary" id="submit">Submit test</button></div></div>`;
  const answers = {};
  view.querySelectorAll('.q .opt').forEach(b => b.onclick = () => {
    const q = b.closest('.q'), i = +q.dataset.i;
    q.querySelectorAll('.opt').forEach(x => x.style.borderColor = 'var(--line)');
    b.style.borderColor = 'var(--indigo)'; answers[i] = b.dataset.pick;
  });
  document.getElementById('submit').onclick = () => {
    view.querySelectorAll('input[data-type]').forEach(inp => answers[+inp.dataset.type] = inp.value);
    let right = 0; const befores = {};
    const rows = S.qs.map((q,i) => {
      let ok;
      if (q.kind === 'mc') ok = answers[i] === q.it.m;
      else if (q.kind === 'tf') ok = answers[i] === String(q.truth);
      else ok = check(answers[i] || '', bk(q)) !== 'no';
      befores[i] = grade(q.it.m, ok); if (ok) right++;
      return `<div class="rev ${ok?'':'no'}" data-row="${i}"><button class="icon" data-say="${esc(q.it.m)}">${SPK}</button>
        <div><div class="m">${esc(q.it.m)} — ${esc(q.it.e)}</div>
        ${ok?'':`<div class="e">you answered: ${esc(answers[i]||'—')}</div>`}</div>
        <button class="btn tiny" data-flip="${i}">${ok?'Mark wrong':'Mark right'}</button></div>`;
    });
    const pct = Math.round(right/S.qs.length*100);
    view.innerHTML = `<div class="panel summary"><div class="eyebrow">Keputusan · result</div><div class="score" id="pct">${pct}%</div>
      <p class="sub" id="scoreline">${right} of ${S.qs.length} correct${pct>=90?' — cemerlang!':pct>=70?' — bagus, keep going':' — run a Learn round on this set next'}</p>
      <div class="rowc"><button class="btn primary" id="again">New test →</button><button class="btn" id="tolearn">Learn the missed ones</button></div>
      <div class="review" id="rev">${rows.join('')}</div></div>`;
    let score = right;
    view.querySelectorAll('[data-flip]').forEach(b => b.onclick = () => {
      const i = +b.dataset.flip, row = b.closest('.rev'), nowWrong = !row.classList.contains('no');
      regrade(S.qs[i].it.m, befores[i], !nowWrong);
      row.classList.toggle('no'); b.textContent = nowWrong ? 'Mark right' : 'Mark wrong';
      score += nowWrong ? -1 : 1;
      document.getElementById('pct').textContent = Math.round(score/S.qs.length*100) + '%';
      document.getElementById('scoreline').textContent = `${score} of ${S.qs.length} correct (adjusted by you)`;
      headline();
    });
    document.getElementById('again').onclick = () => render();
    document.getElementById('tolearn').onclick = () => { mode = 'learn'; LS.pref('mode','learn'); render(); };
    view.querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say, true));
    window.scrollTo(0,0); refreshCount();
  };
}

/* ── Progress ── */
function stats(){
  const seen = TERMS.filter(t => P[t.m] && P[t.m].t);
  const mastered = TERMS.filter(t => isMastered(t.m));
  const due = TERMS.filter(t => isDue(t.m));
  const starred = TERMS.filter(t => P[t.m] && P[t.m].s);
  const weak = seen.filter(t => strength(t.m) <= 1).sort((a,b)=>(P[b.m].w||0)-(P[a.m].w||0)).slice(0,40);
  const soon = {};
  TERMS.forEach(t => { const r = P[t.m]; if (r && r.t && r.d > today()) { const k = Math.min(7, r.d - today()); soon[k] = (soon[k]||0)+1; } });
  const maxSoon = Math.max(1, ...Object.values(soon));
  view.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${due.length}</b><span>Due for review now</span></div>
      <div class="stat"><b>${mastered.length}</b><span>Mastered — 4 right in a row or better</span></div>
      <div class="stat"><b>${seen.length - mastered.length}</b><span>In progress</span></div>
      <div class="stat"><b>${TERMS.length - seen.length}</b><span>Not studied yet</span></div>
    </div>
    <h3 class="h">Levels</h3>
    <div class="themes">${[1,2,3,4,5,6,'P'].map(l => {
      const items = TERMS.filter(t => String(t.l) === String(l)); if (!items.length) return '';
      const m = items.filter(t => isMastered(t.m)).length, s = items.filter(t => P[t.m] && P[t.m].t).length;
      return `<div class="theme"><div class="t">${l === 'P' ? 'Phrases in context' : `Level ${l} · ${esc(LEVELS[l])}`}
        <span>${m} mastered · ${s} started · ${items.length}</span></div>
        <div class="bar"><i style="width:${s/items.length*100}%;background:var(--gold)"></i><u style="width:${m/items.length*100}%"></u></div></div>`;
    }).join('')}</div>
    <h3 class="h">Coming up for review</h3>
    <div class="theme"><div class="t">Next 7 days <span>${starred.length} starred</span></div>
      <div class="sched">${[1,2,3,4,5,6,7].map(d=>{
        const c = soon[d]||0;
        return `<div class="day"><div class="col" style="height:${Math.round(c/maxSoon*70)+4}px"></div><b>${c}</b><span>${d}d</span></div>`;
      }).join('')}</div></div>
    ${weak.length?`<h3 class="h">Your hardest terms</h3>
      <div class="wordlist">${weak.map(t=>`<span class="wchip"><i class="lvl l${strength(t.m)}"></i>${esc(t.m)} <span>${esc(t.e)}</span></span>`).join('')}</div>`:''}
    <h3 class="h">Back up or move your progress</h3>
    <p class="sub">Progress lives in this browser only. Back it up before clearing site data, or to carry it to your phone.</p>
    <div class="rowc" style="justify-content:flex-start;margin-top:12px"><button class="btn" id="export">Back up progress</button><button class="btn" id="import">Restore from backup</button><button class="btn" id="reset">Reset all progress</button></div>
    <div class="panel" id="backup" hidden style="margin-top:14px"></div>`;
  const backup = document.getElementById('backup');
  document.getElementById('export').onclick = () => {
    const json = JSON.stringify({p:P, best, saved:new Date().toISOString()});
    backup.hidden = false;
    backup.innerHTML = `<p class="sub">Your progress, as text. Copy it and keep it anywhere — paste it back on another device to carry your schedule across.</p>
      <textarea id="bk" readonly rows="4">${esc(json)}</textarea>
      <div class="rowc" style="justify-content:flex-start"><button class="btn" id="copy">Copy to clipboard</button><button class="btn" id="dl">Download as file</button></div>`;
    const ta = document.getElementById('bk');
    document.getElementById('copy').onclick = async ev => {
      ta.select();
      try { await navigator.clipboard.writeText(json); } catch(err) { try { document.execCommand('copy'); } catch(e2){} }
      ev.currentTarget.textContent = '✓ Copied'; setTimeout(()=>ev.currentTarget.textContent='Copy to clipboard', 2000);
    };
    document.getElementById('dl').onclick = ev => {
      try {
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], {type:'application/json'}));
        a.download = 'malay-progress.json'; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
      } catch(err) {}
      ev.currentTarget.textContent = 'If nothing downloaded, copy the text instead';
    };
  };
  document.getElementById('import').onclick = () => {
    backup.hidden = false;
    backup.innerHTML = `<p class="sub">Paste a progress backup here and load it. This replaces what is stored in this browser.</p>
      <textarea id="bk" rows="4" placeholder='{"p":{...}}'></textarea>
      <div class="rowc" style="justify-content:flex-start"><button class="btn primary" id="load">Load it</button></div>
      <p class="sub" id="msg"></p>`;
    document.getElementById('load').onclick = () => {
      try {
        const d = JSON.parse(document.getElementById('bk').value);
        if (!d || !d.p) throw 0;
        P = d.p; best = d.best || {}; LS.save(); LS.saveBest(); render();
      } catch(err) { document.getElementById('msg').textContent = 'That does not look like a progress backup — paste the whole text, including the braces.'; }
    };
  };
  document.getElementById('reset').onclick = e => {
    const b = e.currentTarget;
    if (b.dataset.sure) { P = {}; best = {}; LS.save(); LS.saveBest(); render(); }
    else { b.dataset.sure = '1'; b.textContent = 'Click again to erase everything'; }
  };
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') { if (S.keys && e.key === 'Enter') S.keys(e); return; }
  if (S.keys) S.keys(e);
});
render();
</script>

</body></html>
