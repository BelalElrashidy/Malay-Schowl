<style>
:root{
  --ground:#F2F4F1; --panel:#FFFFFF; --ink:#15213B; --muted:#5A6477; --line:#DCE1E6;
  --red:#C23A2E; --green:#2E7A58; --gold:#A26C0B; --indigo:#2F4B8A;
  --red-soft:#F8E4E1; --green-soft:#DFF0E7; --gold-soft:#F8EDD5; --indigo-soft:#E2E8F5;
  --shadow:0 1px 2px rgba(21,33,59,.06),0 8px 28px rgba(21,33,59,.08);
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1320; --panel:#161E2E; --ink:#E8ECF3; --muted:#9AA5B8; --line:#263047;
  --red:#EE7A6C; --green:#5FC194; --gold:#E9B650; --indigo:#8FA8E6;
  --red-soft:#3A1F1E; --green-soft:#16332A; --gold-soft:#3A2E15; --indigo-soft:#1D2946;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0D1320; --panel:#161E2E; --ink:#E8ECF3; --muted:#9AA5B8; --line:#263047;
  --red:#EE7A6C; --green:#5FC194; --gold:#E9B650; --indigo:#8FA8E6;
  --red-soft:#3A1F1E; --green-soft:#16332A; --gold-soft:#3A2E15; --indigo-soft:#1D2946;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-family:var(--display);font-size:18px;margin-right:auto;white-space:nowrap}
.brand small{font-family:var(--body);color:var(--muted);font-size:12px;margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
.btn{font:600 13px var(--body);color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn:focus-visible,select:focus-visible,.chip:focus-visible,.reveal:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
select{font:600 13px var(--body);color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:999px;padding:7px 10px;max-width:220px}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--red);width:0;transition:width .25s}
.stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;padding:clamp(18px,4vw,56px) 16px;display:flex;align-items:center;justify-content:center}
.slide[hidden]{display:none!important}
.inner{width:100%;max-width:1080px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel)}
.count{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.nav{display:flex;gap:8px}
.nav .btn{padding:9px 18px;font-size:14px}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:640px){.hint{display:none}}

/* accent per section */
.a0{--a:var(--red);--as:var(--red-soft)} .a1{--a:var(--green);--as:var(--green-soft)}
.a2{--a:var(--gold);--as:var(--gold-soft)} .a3{--a:var(--indigo);--as:var(--indigo-soft)}

/* songket motif */
.motif{background-color:var(--as);background-image:
  linear-gradient(45deg,transparent 46%,color-mix(in srgb,var(--a) 17%,transparent) 46% 54%,transparent 54%),
  linear-gradient(-45deg,transparent 46%,color-mix(in srgb,var(--a) 17%,transparent) 46% 54%,transparent 54%);
  background-size:26px 26px}

/* title / section slides */
.eyebrow{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--a,var(--red))}
.sec{border-radius:22px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr)}
.sec-top{padding:clamp(22px,4vw,44px);position:relative}
.sec-top .band{position:absolute;inset:0 0 auto 0;height:10px}
.sec h2{font-family:var(--display);font-weight:400;font-size:clamp(36px,6.5vw,72px);line-height:1.02;margin:10px 0 4px;text-wrap:balance}
.sec .sub{font-size:clamp(16px,2vw,22px);color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 clamp(22px,4vw,44px) clamp(22px,4vw,44px)}
.chip{font:600 14px var(--body);border:1px solid var(--line);background:var(--ground);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--a)}
.chip span{color:var(--muted);font-weight:500}
.tool .chip span{display:none}

/* word card */
.word{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);background:var(--panel);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);min-height:min(560px,70vh)}
.pic{display:flex;align-items:center;justify-content:center;position:relative;padding:28px}
.pic .em{font-size:clamp(90px,15vw,190px);line-height:1;filter:drop-shadow(0 10px 18px rgba(0,0,0,.14));animation:pop .35s ease}
.pic .tag{position:absolute;left:16px;top:16px;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;background:var(--panel);color:var(--a);border-radius:999px;padding:5px 10px}
.txt{padding:clamp(22px,4vw,48px);display:flex;flex-direction:column;justify-content:center;gap:16px;min-width:0}
.ms{font-family:var(--display);font-size:clamp(40px,7vw,86px);line-height:1.02;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.speak{border:none;background:var(--a);color:var(--panel);border-radius:999px;padding:8px 14px;font:600 13px var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.speak svg{width:15px;height:15px}
.speak.slow{background:transparent;color:var(--a);border:1px solid var(--a)}
.reveal{all:unset;cursor:pointer;display:block;border-radius:12px}
.en{font-size:clamp(22px,3vw,34px);font-weight:600;margin:0}
.test .reveal .hid{filter:blur(9px);opacity:.55;user-select:none}
.reveal .hid{transition:filter .2s,opacity .2s}
.reveal .cue{display:none;font-size:12px;color:var(--muted);margin-top:4px}
.test .reveal:not(.shown) .cue{display:block}
.test .reveal.shown .hid{filter:none;opacity:1}
.ex{border-left:4px solid var(--a);background:var(--as);border-radius:0 12px 12px 0;padding:14px 16px}
.ex .xm{font-size:clamp(17px,2vw,22px);font-weight:600;margin:0 0 4px}
.ex .xe{margin:0;color:var(--muted);font-size:15px}
.note{font-size:15px;color:var(--muted);margin:0;display:flex;gap:8px}
.note b{color:var(--a);font-weight:700}
@keyframes pop{from{transform:scale(.8);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pic .em{animation:none}.progress i{transition:none}}

/* phrase card */
.phrase{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.phrase .head{display:flex;align-items:center;gap:12px;padding:14px clamp(20px,4vw,44px)}
.phrase .head .ic{font-size:26px}
.phrase .head b{font-weight:700}
.phrase .head span{color:var(--muted);font-size:14px}
.phrase .body{padding:clamp(24px,5vw,60px) clamp(20px,4vw,56px);display:flex;flex-direction:column;gap:18px}
.phrase .ms{font-size:clamp(34px,5.6vw,68px)}
.phrase .dots{display:flex;gap:5px;padding:0 clamp(20px,4vw,56px) 22px;flex-wrap:wrap}
.phrase .dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.phrase .dots i.on{background:var(--a)}

/* intro */
.intro{display:grid;gap:22px}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,8vw,96px);line-height:1;margin:6px 0 0;text-wrap:balance}
.intro .lede{font-size:clamp(17px,2vw,21px);color:var(--muted);max-width:62ch;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0 0 6px;font-size:15px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.sounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.snd{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.snd b{font-family:var(--display);font-weight:400;font-size:26px;display:block}
.snd span{font-size:13px;color:var(--muted)}
kbd{font:500 12px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--panel)}
@media (max-width:760px){
  .word{grid-template-columns:minmax(0,1fr);min-height:0}
  .pic{padding:52px 20px 28px}
  .slide{align-items:flex-start}
  .brand small{display:none}
}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow);z-index:5}
.home{font:600 13px var(--body);color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:4px 2px}
.theme-btn svg{flex:none}
@media (max-width:640px){.theme-btn .theme-label{display:none}}
.home:hover{color:var(--ink)}
.home:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
</style>

<h1>Kata Asas: 333 words</h1>
<p class="lede">The high-frequency words behind most everyday conversation in Malaysia, grouped into 17 themes. One word per slide, with a picture, audio, and a real example sentence.</p>
<div class="cards">
<div class="card"><h3>1 · Look, say, hear</h3><p>Look at the picture, read the word aloud, then press <b>Listen</b> to check yourself.</p></div>

</div>
<div><div class="eyebrow" style="margin-bottom:10px">Malay is spelled as it sounds — learn these and you can read anything</div>
<div class="sounds">
<div class="snd"><b>c</b><span>always "ch" — <i>cari</i> = cha-ri</span></div>
<div class="snd"><b>e</b><span>usually a soft "uh" — <i>emak</i>; sometimes "eh" — <i>elok</i></span></div>
<div class="snd"><b>ng</b><span>as in "singer" — <i>bunga</i></span></div>
<div class="snd"><b>ny</b><span>as in "canyon" — <i>nyanyi</i></span></div>
<div class="snd"><b>sy</b><span>"sh" — <i>syarikat</i></span></div>
<div class="snd"><b>-k</b><span>at word end: a soft stop, barely said — <i>budak</i></span></div>
<div class="snd"><b>r</b><span>lightly rolled; often dropped at word end in KL — <i>pasar</i></span></div>
<div class="snd"><b>a</b><span>final -a often sounds like "uh" in Peninsular speech — <i>saya</i></span></div>
</div></div>

"🏢", "xms": "Syarikat saya kecil.", "xen": "My company is small."}, {"ms": "bos / majikan", "en": "boss / employer", "em": "👔", "xms": "Bos saya cuti.", "xen": "My boss is on leave."}, {"ms": "gaji", "en": "salary", "em": "💸", "xms": "Gaji masuk hujung bulan.", "xen": "Salary comes at month end."}, {"ms": "cuti", "en": "holiday / leave", "em": "🌴", "xms": "Esok cuti umum.", "xen": "Tomorrow is a public holiday."}, {"ms": "komputer", "en": "computer", "em": "💻", "xms": "Komputer saya lambat.", "xen": "My computer is slow."}, {"ms": "telefon", "en": "phone", "em": "📱", "xms": "Nombor telefon awak?", "xen": "Your phone number?"}, {"ms": "e-mel", "en": "email", "em": "📧", "xms": "Saya hantar e-mel.", "xen": "I'll send an email."}]}, {"en": "Little Words & Connectors", "ms": "Kata Hubung", "items": [{"ms": "dan", "en": "and", "em": "➕", "xms": "Nasi dan ayam.", "xen": "Rice and chicken."}, {"ms": "atau", "en": "or", "em": "🔀", "xms": "Teh atau kopi?", "xen": "Tea or coffee?"}, {"ms": "tetapi", "en": "but", "em": "↩️", "xms": "Mahal tetapi sedap.", "xen": "Expensive but tasty."}, {"ms": "kerana / sebab", "en": "because", "em": "🔗", "xms": "Saya lambat sebab hujan.", "xen": "I'm late because of rain."}, {"ms": "jadi", "en": "so", "em": "➡️", "xms": "Hujan, jadi kita tunggu.", "xen": "It's raining, so we wait."}, {"ms": "kalau / jika", "en": "if", "em": "🔣", "xms": "Kalau boleh, datang awal.", "xen": "If possible, come early."}, {"ms": "dengan", "en": "with", "em": "🤝", "xms": "Saya datang dengan kawan.", "xen": "I came with a friend."}, {"ms": "untuk", "en": "for", "em": "🎁", "xms": "Ini untuk awak.", "xen": "This is for you."}, {"ms": "di", "en": "at / in", "em": "📍", "xms": "Saya di rumah.", "xen": "I'm at home."}, {"ms": "ke", "en": "to (a place)", "em": "➡️", "xms": "Saya pergi ke kedai.", "xen": "I'm going to the shop."}, {"ms": "dari", "en": "from", "em": "⬅️", "xms": "Dia datang dari Penang.", "xen": "She came from Penang."}, {"ms": "sudah / dah", "en": "already", "em": "✔️", "xms": "Saya sudah makan.", "xen": "I've already eaten."}, {"ms": "belum", "en": "not yet", "em": "🔜", "xms": "Saya belum siap.", "xen": "I'm not ready yet."}, {"ms": "akan", "en": "will", "em": "🔮", "xms": "Saya akan datang.", "xen": "I will come."}, {"ms": "sedang", "en": "currently (-ing)", "em": "🔄", "xms": "Dia sedang tidur.", "xen": "He's sleeping."}, {"ms": "juga", "en": "also / too", "em": "🔂", "xms": "Saya juga suka.", "xen": "I like it too."}, {"ms": "sangat", "en": "very", "em": "💥", "xms": "Sangat sedap!", "xen": "Very delicious!"}, {"ms": "sikit / sedikit", "en": "a little", "em": "🤏", "xms": "Sikit saja.", "xen": "Just a little."}, {"ms": "banyak", "en": "many / a lot", "em": "🧺", "xms": "Banyak orang.", "xen": "Lots of people."}, {"ms": "semua", "en": "all / everyone", "em": "🌐", "xms": "Terima kasih semua.", "xen": "Thank you everyone."}, {"ms": "jangan", "en": "don't", "em": "⛔", "xms": "Jangan risau.", "xen": "Don't worry."}]}];
const KIND = "vocab";
const stage = document.getElementById('stage');
const slides = [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const spk = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>`;
function speakBtns(t){ const a = esc(t); return `<button class="speak" data-say="${a}">${spk}Listen</button><button class="speak slow" data-say="${a}" data-rate="0.6">Slowly</button>`; }
function reveal(inner, cue){ return `<button class="reveal" type="button"><div class="hid">${inner}</div><div class="cue">${cue}</div></button>`; }

function add(html, sec, title){ const el = document.createElement('section'); el.className='slide'; el.hidden = true; el.innerHTML = `<div class="inner">${html}</div>`; stage.appendChild(el); slides.push({el, sec, title}); return slides.length-1; }

add(document.getElementById('intro-tpl').innerHTML, -1, 'Start');
const secStart = [];
let total = DATA.reduce((n,s)=>n+s.items.length,0), k = 0;
DATA.forEach((s, si) => {
  const acc = 'a' + (si % 4);
  const chips = s.items.map((it, ii) => `<button class="chip" data-jump="${si}:${ii}">${esc(KIND==='vocab'? it.em+' '+it.ms : it.ms)}${KIND==='vocab'?`<span>${esc(it.en)}</span>`:''}</button>`).join('');
  secStart.push(add(`<div class="sec ${acc}"><div class="sec-top motif"><div class="eyebrow">Part ${si+1} of ${DATA.length} · ${s.items.length} ${KIND==='vocab'?'words':'phrases'}</div><h2>${KIND==='phrases'?esc(s.icon)+' ':''}${esc(s.ms)}</h2><p class="sub">${esc(s.en)}${s.desc?' — '+esc(s.desc):''}</p></div><div class="eyebrow" style="padding:18px clamp(22px,4vw,44px) 10px">${KIND==='vocab'?'Preview — tap any word to jump':'In this scene — tap to jump'}</div><div class="chips">${chips}</div></div>`, si, s.ms));
  s.items.forEach((it, ii) => {
    k++;
    if (KIND === 'vocab') {
      add(`<article class="word ${acc}"><div class="pic motif"><span class="tag">${esc(s.en)}</span><div class="em" aria-hidden="true">${it.em}</div></div>
        <div class="txt"><div class="eyebrow">Word ${k} of ${total}</div><h2 class="ms" lang="ms">${esc(it.ms)}</h2>
        <div class="row">${speakBtns(it.ms)}</div>
        ${reveal(`<p class="en">${esc(it.en)}</p>`, 'Tap to reveal the meaning')}
        <div class="ex"><p class="xm" lang="ms">${esc(it.xms)} <button class="speak slow" style="padding:3px 9px;vertical-align:middle" data-say="${esc(it.xms)}" aria-label="Listen to example">${spk}</button></p>${reveal(`<p class="xe">${esc(it.xen)}</p>`, 'Tap to reveal')}</div>
        </div></article>`, si, it.ms);
    } else {
      const dots = s.items.map((_, j) => `<i class="${j<=ii?'on':''}"></i>`).join('');
      add(`<article class="phrase ${acc}"><div class="head motif"><span class="ic" aria-hidden="true">${s.icon}</span><div><b>${esc(s.ms)}</b><br><span>${esc(s.en)} · ${ii+1}/${s.items.length}</span></div></div>
        <div class="body"><div class="eyebrow">Phrase ${k} of ${total}</div><h2 class="ms" lang="ms">${esc(it.ms)}</h2>
        <div class="row">${speakBtns(it.ms)}</div>
        ${reveal(`<p class="en">${esc(it.en)}</p>`, 'Tap to reveal the meaning')}
        ${it.note?`<p class="note"><b>Tip</b>${esc(it.note)}</p>`:''}</div><div class="dots">${dots}</div></article>`, si, it.ms);
    }
  });
});
add(document.getElementById('outro-tpl').innerHTML, -1, 'Finish');

// section select
const sel = document.getElementById('jump');
sel.innerHTML = `<option value="0">Start</option>` + DATA.map((s,i)=>`<option value="${secStart[i]}">${i+1}. ${esc(s.ms)} · ${esc(s.en)}</option>`).join('');

let cur = 0;
const KEY = 'malay-'+KIND+'-pos';
try { const v = parseInt(localStorage.getItem(KEY)); if (v>=0 && v<slides.length) cur = v; } catch(e){}
function show(i){
  i = Math.max(0, Math.min(slides.length-1, i));
  slides[cur].el.hidden = true; cur = i; const s = slides[cur]; s.el.hidden = false; s.el.scrollTop = 0;
  s.el.querySelectorAll('.reveal.shown').forEach(r=>r.classList.remove('shown'));
  document.getElementById('count').textContent = `${cur+1} / ${slides.length}`;
  document.getElementById('prog').style.width = (cur/(slides.length-1)*100)+'%';
  let secIdx = -1; secStart.forEach((st, j) => { if (cur >= st) secIdx = j; });
  sel.value = secIdx < 0 ? '0' : String(secStart[secIdx]);
  try { localStorage.setItem(KEY, cur); } catch(e){}
  if (auto.getAttribute('aria-pressed')==='true') { const b = s.el.querySelector('.speak'); if (b) say(b.dataset.say, 1); }
}
sel.addEventListener('change', () => show(parseInt(sel.value)));
document.getElementById('prev').onclick = () => show(cur-1);
document.getElementById('next').onclick = () => show(cur+1);

// test mode
const testBtn = document.getElementById('test');
function setTest(on){ document.body.classList.toggle('test', on); testBtn.setAttribute('aria-pressed', on); try{localStorage.setItem('malay-test', on?'1':'0')}catch(e){} }
testBtn.onclick = () => setTest(testBtn.getAttribute('aria-pressed') !== 'true');
try { if (localStorage.getItem('malay-test')==='1') setTest(true); } catch(e){}
const auto = document.getElementById('auto');
auto.onclick = () => auto.setAttribute('aria-pressed', auto.getAttribute('aria-pressed')!=='true');

// speech
let voice = null;
function pickVoice(){ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/malay/i.test(v.name)) || vs.find(v=>/^id/i.test(v.lang)) || null; }
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate){
  if (!('speechSynthesis' in window)) { toast('Audio isn\'t supported in this browser.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g, ', ').replace(/_+/g,' '));
  u.lang = voice ? voice.lang : 'ms-MY'; if (voice) u.voice = voice; u.rate = rate || 0.95;
  speechSynthesis.speak(u);
  if (!voice) toast('No Malay voice found on this device — install one in system speech settings for best audio.');
}
let tt; function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(()=>t.hidden = true, 3500); }

stage.addEventListener('click', e => {
  const b = e.target.closest('.speak'); if (b) { e.stopPropagation(); say(b.dataset.say, parseFloat(b.dataset.rate)||0.95); return; }
  const r = e.target.closest('.reveal'); if (r) { r.classList.toggle('shown'); return; }
  const c = e.target.closest('[data-jump]'); if (c) { const [si, ii] = c.dataset.jump.split(':').map(Number); show(secStart[si] + 1 + ii); return; }
  const g = e.target.closest('[data-go]'); if (g) { show(parseInt(g.dataset.go)); }
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (['ArrowRight','PageDown'].includes(e.key) || (e.key===' ' && !e.target.closest('button'))) { e.preventDefault(); show(cur+1); }
  else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); show(cur-1); }
  else if (e.key === 'Enter' && !e.target.closest('button')) { slides[cur].el.querySelectorAll('.reveal').forEach(r=>r.classList.add('shown')); }
  else if (e.key.toLowerCase() === 'l') { const b = slides[cur].el.querySelector('.speak'); if (b) say(b.dataset.say, 0.95); }
  else if (e.key.toLowerCase() === 't') setTest(testBtn.getAttribute('aria-pressed') !== 'true');
  else if (e.key === 'Home') show(0); else if (e.key === 'End') show(slides.length-1);
});
let sx = null, sy = null;
stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
stage.addEventListener('touchend', e => { if (sx===null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5) show(cur + (dx<0?1:-1)); sx = null; }, {passive:true});
show(cur);
</script>
