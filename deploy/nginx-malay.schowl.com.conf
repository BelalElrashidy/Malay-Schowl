# malay.schowl.com -> Malay Schowl study site (container on 127.0.0.1:3900).
# Installed on the server as /etc/nginx/sites-enabled/malay-schowl
server { listen 80; listen [::]:80; server_name malay.schowl.com; return 301 https://$host$request_uri; }
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name malay.schowl.com;
    ssl_certificate     /etc/nginx/ssl/schowl-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/schowl-origin.key;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    access_log /var/log/nginx/malay-schowl.access.log;
    location / { proxy_pass http://127.0.0.1:3900; include /etc/nginx/snippets/proxy-common.conf; }
}
