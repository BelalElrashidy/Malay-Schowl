server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # relative Location headers: correct scheme behind Cloudflare

    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Pages are small; always revalidate so updates show up immediately
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The phrase and vocabulary decks were folded into the trainer (see archive/)
    location ~ ^/(phrases|vocabulary)(\.html)?$ { return 301 /trainer; }

    # Friendly URLs: /lessons, /trainer, /grammar
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /index.html;
}
